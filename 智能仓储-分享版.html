>\n#warehouseNav .side-section{border-top:1px solid #edf0ed;margin-top:3px;padding-top:3px}\n#warehouseNav .side-section:first-of-type{border-top:0}\n#warehouseNav .section-title{font-weight:600;height:36px;font-size:13px}\n#warehouseNav .side-children{display:none;padding-left:18px}\n#warehouseNav .expanded>.side-children{display:block}\n#warehouseNav .side-children .nav{height:29px;font-size:12px;color:#758078}\n#warehouseNav .nav.active{background:var(--green2);color:#2f6130;font-weight:600}\n.category-settings .modal{max-height:90vh;display:flex;flex-direction:column}\n.category-settings .modal-body{overflow:auto;min-height:0}\n.category-settings input{width:170px;height:32px;padding:0 8px;border:1px solid #cfd8d0;border-radius:3px}\n.category-settings .hint{margin-bottom:12px}\n.link:disabled{color:#a6ada7;cursor:not-allowed}\n\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cheader class=\"topbar\">\u003cdiv class=\"brand\">八斗芯链数智农业产品平台\u003c/div>\u003cdiv class=\"top-actions\">\u003cspan>admin\u003c/span>\u003cspan>门户\u003c/span>\u003c/div>\u003c/header>\n  \u003cdiv class=\"body\">\n    \u003caside class=\"side\" id=\"warehouseNav\">\u003c/aside>\n\u003cscript>\nwindow.__warehouseRouteUrl = parent.__warehouseCurrentUrl;\ndocument.addEventListener('click', function (event) {\n  const link = event.target.closest('[data-internal-route]');\n  if (link) { event.preventDefault(); parent.showWarehouseRoute(link.dataset.internalRoute); }\n});\n(function () {\n  const host = document.getElementById('warehouseNav'); if (!host) return;\n  const menu = [[\"标签管理\",[[\"标签档案\",\"label-management.html\"],[\"标签查询\",\"label-query.html\"]]],[\"仓库管理\",[[\"仓库档案\",\"warehouse-config.html\"],[\"库存查询\",\"inventory-ledger.html?view=warehouse\"],[\"库存盘点\",\"stocktake-management.html\"],[\"预警记录\",\"warehouse-warning.html\"]]],[\"容器管理\",[[\"容器档案\",\"container-management.html\"],[\"容器出入库\",\"warehouse-operation.html?object=container\"],[\"容器台账\",\"container-ledger.html\"]]],[\"农资管理\",[[\"农资档案\",\"agricultural-supply-management.html\"],[\"农资入库\",\"agricultural-supply-inbound.html\"],[\"农资出库\",\"agricultural-supply-outbound.html\"],[\"库存台账\",\"inventory-ledger.html?object=supply\"]]],[\"原料管理\",[[\"原料档案\",\"raw-material-management.html\"],[\"原料采购\",\"raw-material-purchase.html\"],[\"原料入库\",\"raw-material-inbound.html\"],[\"原料出库\",\"raw-material-outbound.html\"],[\"原料退料\",\"raw-material-return.html\"],[\"库存台账\",\"inventory-ledger.html?object=raw\"]]],[\"产品管理\",[[\"产品档案\",\"product-management.html\"],[\"产品入库\",\"product-operation.html?view=inbound\"],[\"产品出库\",\"product-operation.html?view=outbound\"],[\"库存台账\",\"inventory-ledger.html?object=product\"]]],[\"报表与统计分析\",[[\"库存报表\",\"warehouse-report.html?view=inventory\"],[\"出入库操作流水\",\"warehouse-report.html?view=operation-flow\"],[\"差异报表\",\"warehouse-report.html?view=difference\"],[\"发货报表\",\"warehouse-report.html?view=shipping\"]]]];\n  const current = new URL(window.__warehouseRouteUrl);\n  const matches = route => { const target = new URL(route, window.__warehouseRouteUrl); return target.pathname === current.pathname && ['object','view'].every(k => target.searchParams.get(k) === current.searchParams.get(k)); };\n  let closed = []; try { closed = JSON.parse(sessionStorage.getItem('warehouse-closed-menus') || '[]'); } catch (_) {}\n  host.innerHTML = '\u003cdiv class=\"side-group\">\u003cdiv class=\"side-title\">智能仓储\u003c/div>' + menu.map(([title, children], index) => { const active = children.some(([,route]) => matches(route)); return '\u003cdiv class=\"side-section ' + (!closed.includes(title) || active ? 'expanded' : '') + '\">\u003cbutton class=\"nav section-title ' + (active ? 'active' : '') + '\" data-group=\"' + index + '\">' + title + '\u003c/button>\u003cdiv class=\"side-children\">' + children.map(([label,route]) => '\u003cbutton class=\"nav ' + (matches(route) ? 'active' : '') + '\" data-route=\"' + route + '\">' + label + '\u003c/button>').join('') + '\u003c/div>\u003c/div>'; }).join('') + '\u003c/div>';\n  host.querySelectorAll('[data-route]').forEach(button => button.onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\n    \u003cmain class=\"content\">\n      \u003cdiv class=\"crumb\">智能仓储 / 标签管理 / 标签档案\u003c/div>\n      \u003cdiv class=\"head\">\u003cdiv>\u003ch1 id=\"pageTitle\">标签档案\u003c/h1>\u003cp id=\"pageDescription\">按对象类别维护标签编码规则；点击对象卡片查看标签绑定记录\u003c/p>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"addTypeBtn\">标签类型设置\u003c/button>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stats\" id=\"typeStats\">\u003cdiv class=\"stat\">标签对象\u003cstrong id=\"typeCount\">7\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">标签总数\u003cstrong>2,846\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">已绑定\u003cstrong>2,411\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">未绑定\u003cstrong>435\u003c/strong>\u003c/div>\u003c/div>\n      \u003csection class=\"panel\" id=\"typeSections\">\u003c/section>\n      \u003csection class=\"panel\" id=\"recordsView\" style=\"display:none\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003cspan class=\"panel-title\" id=\"recordsTitle\">\u003c/span>\u003cdiv class=\"muted\" id=\"recordsSubtitle\">\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"recordBackBtn\">返回标签档案\u003c/button>\u003cbutton class=\"btn\" id=\"recordSecondaryBtn\">\u003c/button>\u003cbutton class=\"btn primary\" id=\"recordPrimaryBtn\">\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"rfidDeviceBar\" class=\"rfid-device-bar\" style=\"display:none\">\u003cdiv>\u003cstrong>RFID打印/写入设备\u003c/strong>\u003cspan class=\"muted\">仅演示设备状态，不代表已连接真实硬件\u003c/span>\u003c/div>\u003cselect id=\"rfidPrinter\">\u003coption>RFID打印编码器 · RFID-PR-01\u003c/option>\u003coption>RFID桌面发卡器 · RFID-PR-02\u003c/option>\u003c/select>\u003cspan class=\"device-state\" id=\"rfidPrinterState\">未连接\u003c/span>\u003cbutton class=\"btn small\" id=\"rfidConnectBtn\">连接设备\u003c/button>\u003cbutton class=\"btn small\" id=\"rfidTestBtn\" disabled>测试写入\u003c/button>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>\u003cinput id=\"selectAllRecords\" type=\"checkbox\" aria-label=\"全选未绑定标签\">\u003c/th>\u003cth>标签编码\u003c/th>\u003cth>编码来源\u003c/th>\u003cth>物理类型\u003c/th>\u003cth>业务对象\u003c/th>\u003cth>标签内容/访问链接\u003c/th>\u003cth>绑定时间\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"recordsBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"typeModal\">\u003cdiv class=\"modal wide\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\">标签类型设置\u003c/span>\u003cbutton class=\"close\" data-close=\"typeModal\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"form-grid maintenance-form\">\n  \u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 关联对象类别\u003c/label>\u003cselect id=\"typeObject\">\u003coption value=\"仓库\">仓库\u003c/option>\u003coption value=\"容器\">容器\u003c/option>\u003coption value=\"农资\">农资\u003c/option>\u003coption value=\"原料\">原料\u003c/option>\u003c/select>\u003c/div>\n  \u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 关联对象\u003c/label>\u003cselect id=\"typeTarget\">\u003c/select>\u003c/div>\n  \u003cdiv class=\"form-item\">\u003clabel>标签对象名称（自动带出）\u003c/label>\u003cinput id=\"typeName\" readonly>\u003c/div>\n  \u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 物理类型\u003c/label>\u003cselect id=\"physicalType\">\u003coption>RFID\u003c/option>\u003coption>二维码\u003c/option>\u003c/select>\u003c/div>\n  \u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 标签编码来源\u003c/label>\u003cselect id=\"codeSource\">\u003coption value=\"生成新编码\">生成新编码\u003c/option>\u003coption value=\"关联原业务编码\">关联原业务编码\u003c/option>\u003c/select>\u003c/div>\n  \u003cdiv class=\"form-item full\">\u003clabel>标签读取展示字段\u003c/label>\u003cdiv id=\"fieldOptions\" class=\"field-options\">\u003c/div>\u003cspan class=\"hint\">读取标签后按对象编码查询并展示所选业务字段；实时库存、位置、状态等动态信息不固化到标签。\u003c/span>\u003c/div>\n  \u003cdiv class=\"form-item full\">\u003cbutton class=\"btn primary\" id=\"saveTypeBtn\">保存配置\u003c/button>\u003c/div>\n\u003c/div>\u003cdiv class=\"maintenance-table\">\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>对象类别\u003c/th>\u003cth>关联对象类别\u003c/th>\u003cth>物理类型\u003c/th>\u003cth>标签编码来源\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"maintenanceRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn primary\" data-close=\"typeModal\">完成\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"generateModal\">\u003cdiv class=\"modal wide\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\" id=\"generateTitle\">标签生成\u003c/span>\u003cbutton class=\"close\" data-close=\"generateModal\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\n  \u003cdiv class=\"choice-row\">\u003cbutton class=\"choice active\" data-mode=\"rule\">按编码规则生成\u003c/button>\u003cbutton class=\"choice\" data-mode=\"import\">导入标签编码\u003c/button>\u003c/div>\n  \u003cdiv id=\"rulePane\" style=\"margin-top:16px\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"form-item full\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 编码规则\u003c/label>\u003cinput id=\"generateRule\" placeholder=\"按对象类别配置编码规则\">\u003cspan class=\"hint\" id=\"ruleGuidance\">\u003c/span>\u003c/div>\u003cdiv class=\"form-item full\" id=\"productInitials\" style=\"display:none\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 种养主体首字母 / 产品首字母\u003c/label>\u003cdiv class=\"source-line\">\u003cinput id=\"subjectInitial\" placeholder=\"主体首字母\">\u003cinput id=\"productInitial\" placeholder=\"产品首字母\">\u003c/div>\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 溯源链接模板\u003c/label>\u003cinput id=\"generateTrace\" placeholder=\"https://trace.example.com/{code}\">\u003cspan class=\"hint\">模板需包含 {code}，生成/打印标签时据此生成对应溯源链接。\u003c/span>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 生成数量\u003c/label>\u003cinput id=\"generateCount\" type=\"number\" min=\"1\" value=\"100\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 起始序号\u003c/label>\u003cinput id=\"startNo\" type=\"number\" min=\"1\" value=\"1\">\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>编码预览\u003c/label>\u003cinput id=\"generatePreview\" readonly>\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>溯源链接预览\u003c/label>\u003cinput id=\"tracePreview\" readonly>\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv id=\"importPane\" style=\"display:none;margin-top:16px\">\u003cdiv class=\"file-box\">\u003cinput id=\"tagFile\" type=\"file\" accept=\".csv,.txt\">\u003cp>支持 CSV、TXT，每行一个标签编码；编码不可重复\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"generateModal\">取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveGenerateBtn\">确认生成\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"bindModal\">\u003cdiv class=\"modal wide\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\" id=\"bindTitle\">标签绑定\u003c/span>\u003cbutton class=\"close\" data-close=\"bindModal\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"notice\" id=\"bindSummary\">\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>标签编码\u003c/th>\u003cth>关联业务对象\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"bindRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"hint\">每条标签记录对应一个业务对象；同一批次中不能重复选择对象。\u003c/p>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"bindModal\">取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveBindBtn\">确认绑定\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"logModal\">\u003cdiv class=\"modal\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\" id=\"logTitle\">操作记录\u003c/span>\u003cbutton class=\"close\" data-close=\"logModal\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cpre id=\"logBody\" style=\"white-space:pre-wrap;overflow-wrap:anywhere;font:inherit\">\u003c/pre>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"logModal\">关闭\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\nconst objectTargets={仓库:['仓库节点','库区节点','货架节点','库位节点'],容器:['可循环周转桶','一次性采收袋','周转箱'],农资:['生产用种','种质保存材料','肥料','农药','土壤改良剂'],原料:['白桦树汁原液','香沙芋原料','生物发酵基料'],产品:['香沙芋特大果','香沙芋精品果','白桦树汁成品']};\nconst suggestedRules={仓库:'WH-{yyyyMMdd}-{0000}',容器:'CT-{yyyyMMdd}-{000000}',农资:'AG-{yyyyMMdd}-{000000}',原料:'RM-{yyyyMMdd}-{000000}',产品:'{主体}-{产品}-{yyyyMMdd}-{0000}'};\nconst displayFieldOptions={仓库:['节点名称','节点类型','仓库编码'],容器:['容器编号','容器类型','规格','母容器编号'],农资:['农资名称','农资类型','规格','计量单位'],原料:['原料名称','规格','计量单位','批次号']};\nconst realTargets={仓库:['白桦树汁仓库 / 仓库节点','白桦树汁仓库 / 冷藏库区','香沙芋仓库 / 成品库区'],容器:['可循环周转桶 / CT-001','可循环周转桶 / CT-002','一次性采收袋 / BAG-001'],农资:['生产用种 / XSZ-2026-001','种质保存材料 / GERM-001','肥料 / FERT-001'],原料:['白桦树汁原液 / RM-2026-001','香沙芋原料 / RM-2026-002'],产品:['香沙芋特大果 / PR-2026-001','白桦树汁成品 / PR-2026-002']};\nconst sourcePages={仓库:'warehouse-config.html',容器:'container-management.html',农资:'agricultural-supply-management.html',原料:'raw-material-management.html',产品:'product-management.html'};\nconst groups={仓库:[{name:'仓库 · 仓库节点',physical:'RFID',codeSource:'生成新编码',rule:'WH-{yyyyMMdd}-{0000}',traceLink:'https://trace.example.com/{code}',total:32,bound:30,enabled:true}],容器:[{name:'容器 · 可循环周转桶',physical:'RFID',codeSource:'关联原业务编码',rule:'CT-{yyyyMMdd}-{000000}',traceLink:'https://trace.example.com/{code}',total:680,bound:642,enabled:true},{name:'容器 · 一次性采收袋',physical:'二维码',codeSource:'生成新编码',rule:'BAG-{yyyyMMdd}-{000000}',traceLink:'https://trace.example.com/{code}',total:920,bound:781,enabled:true}],农资:[{name:'农资 · 生产用种',physical:'二维码',codeSource:'生成新编码',rule:'AG-SEED-{yyyyMMdd}-{000000}',traceLink:'https://trace.example.com/{code}',total:12,bound:8,enabled:true}],原料:[{name:'原料 · 白桦树汁原液',physical:'RFID',codeSource:'关联原业务编码',rule:'RM-{yyyyMMdd}-{000000}',traceLink:'https://trace.example.com/{code}',total:386,bound:344,enabled:true}],产品:[{name:'产品 · 香沙芋特大果',physical:'二维码',codeSource:'生成新编码',rule:'{主体}-{产品}-{yyyyMMdd}-{0000}',traceLink:'https://trace.example.com/{code}',total:420,bound:355,enabled:true},{name:'产品 · 白桦树汁成品',physical:'二维码',codeSource:'关联原业务编码',rule:'PR-{yyyyMMdd}-{000000}',traceLink:'https://trace.example.com/{code}',total:168,bound:69,enabled:false}]};\nvar savedGroups=localStorage.getItem('warehouse-label-groups');if(savedGroups){try{var restoredGroups=JSON.parse(savedGroups);Object.keys(groups).forEach(function(k){groups[k]=restoredGroups[k]||[]})}catch(e){}}\nfunction plainName(group,name){return String(name||'').replace(group+' · ','')}\nObject.keys(groups).forEach(function(group){groups[group].forEach(function(item){item.name=plainName(group,item.name)})});\nlet currentType=null;\nfunction showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1600)}\nfunction openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}\nfunction renderTypes(){var all=Object.values(groups).flat();all.forEach(function(x){x.total=x.records.length;x.bound=x.records.filter(function(r){return r.status==='已绑定'}).length});var sums=typeStats.querySelectorAll('.stat strong');sums[1].textContent=all.reduce(function(n,x){return n+x.total},0);sums[2].textContent=all.reduce(function(n,x){return n+x.bound},0);sums[3].textContent=all.reduce(function(n,x){return n+x.total-x.bound},0);var html='';Object.keys(groups).forEach(function(group){var items=groups[group];if(!items.length)return;html+='\u003cdiv class=\"object-section\">\u003cdiv class=\"object-head\">\u003ch3>'+group+'标签\u003c/h3>\u003cspan class=\"muted\">'+items.length+' 个标签对象\u003c/span>\u003c/div>\u003cdiv class=\"type-grid\">';items.forEach(function(x,i){html+='\u003carticle class=\"type-card '+(x.enabled?'':'disabled')+'\" role=\"button\" tabindex=\"0\" data-card-group=\"'+group+'\" data-card-index=\"'+i+'\">\u003cdiv class=\"type-card-head\">\u003cdiv>\u003ch4>'+x.name+'\u003c/h4>\u003cp>'+x.physical+' · '+x.codeSource+'\u003c/p>\u003c/div>\u003cspan class=\"tag '+(x.enabled?'green':'gray')+'\">'+(x.enabled?'启用':'禁用')+'\u003c/span>\u003c/div>\u003cdiv class=\"type-meta\">\u003cdiv>\u003cspan>标签总数\u003c/span>\u003cstrong>'+x.total+'\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>已绑定\u003c/span>\u003cstrong>'+x.bound+'\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>未绑定\u003c/span>\u003cstrong>'+(x.total-x.bound)+'\u003c/strong>\u003c/div>\u003c/div>'+(group==='产品'?'\u003cspan class=\"muted\">标签下发由溯源监管统一处理 →\u003c/span>':'')+'\u003c/article>'});html+='\u003c/div>\u003c/div>'});typeSections.innerHTML=html;typeSections.querySelectorAll('[data-card-group]').forEach(function(card){var open=function(){if(card.dataset.cardGroup==='产品'){window.__warehouseLocation.href='tag-product-selection.html';return}openRecordView(card.dataset.cardGroup,Number(card.dataset.cardIndex))};card.onclick=open;card.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});typeCount.textContent=Object.values(groups).flat().length}\nfunction renderMaintenance(){var html='';Object.keys(groups).forEach(function(group){groups[group].forEach(function(x,i){html+='\u003ctr>\u003ctd>'+group+'\u003c/td>\u003ctd>'+x.name+'\u003c/td>\u003ctd>'+x.physical+'\u003c/td>\u003ctd>'+x.codeSource+'\u003c/td>\u003ctd>\u003cspan class=\"tag '+(x.enabled?'green':'gray')+'\">'+(x.enabled?'启用':'禁用')+'\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"link\" data-edit=\"'+group+'\" data-index=\"'+i+'\">编辑\u003c/button>\u003cbutton class=\"link\" data-toggle=\"'+group+'\" data-index=\"'+i+'\">'+(x.enabled?'禁用':'启用')+'\u003c/button>\u003cbutton class=\"link\" data-delete=\"'+group+'\" data-index=\"'+i+'\">删除\u003c/button>\u003c/td>\u003c/tr>'})});maintenanceRows.innerHTML=html;maintenanceRows.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){var item=groups[b.dataset.edit][Number(b.dataset.index)];if(b.dataset.edit==='产品')return showToast('产品标签配置请前往溯源监管维护');typeObject.value=b.dataset.edit;syncTargets(item.displayFields);typeTarget.value=item.name;typeName.value=item.name;physicalType.value=item.physical;codeSource.value=item.codeSource;typeModal.dataset.editGroup=b.dataset.edit;typeModal.dataset.editIndex=b.dataset.index;saveTypeBtn.textContent='保存配置'}});maintenanceRows.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(){groups[b.dataset.toggle][Number(b.dataset.index)].enabled=!groups[b.dataset.toggle][Number(b.dataset.index)].enabled;renderMaintenance();renderTypes()}});maintenanceRows.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){var item=groups[b.dataset.delete][Number(b.dataset.index)];if(item.total>0){showToast('已有标签记录的对象不能删除，只能禁用');return}groups[b.dataset.delete].splice(Number(b.dataset.index),1);renderMaintenance();renderTypes()}})}\nfun ) => matches(route)); return '\u003cdiv class=\"side-section ' + (!closed.includes(title) || active ? 'expanded' : '') + '\">\u003cbutton class=\"nav section-title ' + (active ? 'active' : '') + '\" data-group=\"' + index + '\">' + title + '\u003c/button>\u003cdiv class=\"side-children\">' + children.map(([label,route]) => '\u003cbutton class=\"nav ' + (matches(route) ? 'active' : '') + '\" data-route=\"' + route + '\">' + label + '\u003c/button>').join('') + '\u003c/div>\u003c/div>'; }).join('') + '\u003c/div>';\n  host.querySelectorAll('[data-route]').forEach(button => button.onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\n\u003cmain class=\"content\">\u003cdiv class=\"crumb\">智能仓储 / 标签管理 / 标签查询\u003c/div>\u003cdiv class=\"head\">\u003cdiv>\u003ch1>标签查询\u003c/h1>\u003cp>按标签编码、对象类别和绑定状态查询标签台账\u003c/p>\u003c/div>\u003cbutton class=\"btn\" id=\"exportBtn\">导出查询结果\u003c/button>\u003c/div>\u003csection class=\"panel\">\u003cdiv class=\"query\">\u003cdiv class=\"form-item\">\u003clabel>标签编码\u003c/label>\u003cinput id=\"qCode\" placeholder=\"请输入标签编码\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>物理类型\u003c/label>\u003cselect id=\"qPhysical\">\u003coption value=\"\">全部\u003c/option>\u003coption>RFID\u003c/option>\u003coption>二维码\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>对象类别\u003c/label>\u003cselect id=\"qCategory\">\u003coption value=\"\">全部\u003c/option>\u003coption>仓库\u003c/option>\u003coption>容器\u003c/option>\u003coption>农资\u003c/option>\u003coption>原料\u003c/option>\u003coption>产品\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>绑定状态\u003c/label>\u003cselect id=\"qStatus\">\u003coption value=\"\">全部\u003c/option>\u003coption>已绑定\u003c/option>\u003coption>未绑定\u003c/option>\u003coption>已作废\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"query-actions\">\u003cbutton class=\"btn primary\" id=\"searchBtn\">查询\u003c/button>\u003cbutton class=\"btn\" id=\"resetBtn\">重置\u003c/button>\u003c/div>\u003c/div>\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>标签编码\u003c/th>\u003cth>物理类型\u003c/th>\u003cth>编码来源\u003c/th>\u003cth>对象类别\u003c/th>\u003cth>关联对象\u003c/th>\u003cth>绑定状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/section>\u003c/main>\u003c/div>\u003c/div>\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\n(function () {\n  'use strict';\n  const read = (key, fallback) => { try { return JSON.parse(sessionStorage.getItem(key)) ?? structuredClone(fallback); } catch (_) { return structuredClone(fallback); } };\n  const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(value));\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const now = () => new Date().toLocaleString('sv-SE');\n  const types = [{name:'白桦树汁周转桶',level:'可选母子二层',use:'重复利用',enabled:true},{name:'香沙芋采收袋',level:'单层',use:'一次性',enabled:true},{name:'生物制造周转箱',level:'母子二层',use:'重复利用',enabled:true}];\n  const containers = [\n    {no:'CT-GROUP-001',type:types[0].name,parent:'',tag:'-',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-001',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-001',location:'领用现场',order:'RW20261029001',status:'出库-使用中',used:true},\n    {no:'CT-002',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-002',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-003',type:types[0].name,parent:'',tag:'RFID-CT-003',location:'白桦树汁仓库',order:'-',status:'在库',used:true},\n    {no:'CT-004',type:types[0].name,parent:'',tag:'-',location:'运输现场',order:'TS20261029002',status:'待归还',used:true},\n    {no:'BAG-001',type:types[1].name,parent:'',tag:'QR-BAG-001',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-002',type:types[1].name,parent:'',tag:'-',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-003',type:types[1].name,parent:'',tag:'-',location:'采收现场',order:'RW20261028003',status:'待归还',used:true},\n    {no:'BOX-001',type:types[2].name,parent:'',tag:'RFID-BOX-001',location:'维护区',order:'-',status:'维护中',used:true},\n    {no:'BOX-002',type:types[2].name,parent:'',tag:'RFID-BOX-002',location:'生产现场',order:'PO20261028001',status:'出库-使用中',used:true},\n    {no:'BOX-003',type:types[2].name,parent:'',tag:'-',location:'生物制造仓库',order:'-',status:'在库',used:false}\n  ].map((x,i) => ({id:'container-'+i,warehouse:x.location.endsWith('仓库')?x.location:x.no.startsWith('BOX')?'生物制造仓库':'白桦树汁仓库',spec:'',...x}));\n  const receipts = [\n    {no:'PR-IN-20261030-001',product:'白桦树汁成品',batch:'PR-BS-20261030',qty:'500 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-01',order:'PO-20261030-005',time:'2026-10-30 10:30',expiry:'2027-04-30'},\n    {no:'PR-IN-20261031-002',product:'白桦树汁成品',batch:'PR-BS-20261031',qty:'300 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-02',order:'-',time:'2026-10-31 10:30',expiry:'2027-03-31'},\n    {no:'PR-IN-20261031-003',product:'生物制造企业成品',batch:'PR-BIO-20261031',qty:'200 瓶',warehouse:'生物制造仓库',location:'成品库 / M-01',order:'-',time:'2026-10-31 11:30',expiry:'2027-05-31'}\n  ];\n  const raw = [{name:'白桦树汁原料',type:'原料',batch:'SAP-20261030',qty:'1066',unit:'kg',tag:'CT-001 / RFID-CT-001',time:'2026-10-30 09:20',warehouse:'白桦树汁仓库',location:'白桦树汁仓库 / 冷藏库 A / A-01 / A-01-01',state:'在库'}];\n  const supply = [{name:'生产用种',type:'农资',batch:'SD-20261030',qty:'1200',unit:'kg',time:'2026-10-30 08:00',warehouse:'香沙芋仓库',location:'香沙芋仓库 / 常温库 B / B-01-01',state:'在库'}];\n  function containerList() { return read('warehouse-containers', containers); }\n  function containerHistory() {\n    return read('warehouse-container-history', [\n      {no:'CO20261029001',containers:['CT-001','CT-003'],action:'新增出库',from:'白桦树汁仓库',to:'采收现场',order:'RW20261029001',time:'2026-10-29 09:20',user:'admin',note:'领用周转桶'},\n      {no:'CI20261030001',containers:['CT-003'],action:'核销入库',from:'采收现场',to:'白桦树汁仓库',order:'RW20261029001',time:'2026-10-30 18:20',user:'李四',note:'已归还'},\n      {no:'CO20261029002',containers:['CT-004','BAG-003','BOX-002'],action:'新增出库',from:'仓库',to:'业务现场',order:'TS20261029002',time:'2026-10-29 10:00',user:'admin',note:'业务领用'}\n    ]);\n  }\n  function deletionReason(x, list = containerList()) {\n    if (x.deleted) return '容器已删除';\n    if (frozen(x.warehouse,'容器',x.location)) return '容器所在范围正在盘点';\n    if (x.status !== '在库') return '仅在库容器可删除';\n    if (x.used || containerHistory().some(h => h.containers.includes(x.no) && !['首次入库','期初入库'].includes(h.action))) return '容器已有使用或流转记录';\n    if (list.some(c => !c.deleted && c.parent === x.no)) return '请先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.object==='原料'?raw:supply);\n      const x=list.find(x=>x.batch===row.batch&&x.warehouse===task.warehouse&&x.location.includes(row.location));\n      if(!x)throw Error('原库存记录已变化，请重新盘点');x.qty=String(quantity);write(key,list);\n    } else if (quantity !== 1) throw Error('容器身份差异需先核实具体容器，不支持直接修改件数');\n  }\n  window.WarehouseState = {read,write,escape,now,types,receipts,raw,supply,containers:containerList,history:containerHistory,deletionReason,flow,productStocks,locations,frozen,moveProduct,stocks,adjust};\n})();\n\n\u003c/script>\u003cscript>\n(function(){\n const S=WarehouseState,E=S.escape,$=id=>document.getElementById(id);\n const seed=[{code:'RFID-WH-001',physical:'RFID',source:'生成新编码',object:'仓库',target:'白桦树汁仓库',state:'已绑定',logs:[]},{code:'QR-XSY-000031',physical:'二维码',source:'生成新编码',object:'产品',target:'-',state:'未绑定',logs:[]},{code:'QR-RM-000008',physical:'二维码',source:'关联原业务编码',object:'原料',target:'香沙芋原料批次',state:'已绑定',logs:[]}];\n const notify=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)};\n const mask=document.createElement('div');mask.className='modal-mask';mask.innerHTML='\u003cdiv class=\"modal\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\" id=\"labelTitle\">\u003c/spa ag:'-',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-003',type:types[1].name,parent:'',tag:'-',location:'采收现场',order:'RW20261028003',status:'待归还',used:true},\n    {no:'BOX-001',type:types[2].name,parent:'',tag:'RFID-BOX-001',location:'维护区',order:'-',status:'维护中',used:true},\n    {no:'BOX-002',type:types[2].name,parent:'',tag:'RFID-BOX-002',location:'生产现场',order:'PO20261028001',status:'出库-使用中',used:true},\n    {no:'BOX-003',type:types[2].name,parent:'',tag:'-',location:'生物制造仓库',order:'-',status:'在库',used:false}\n  ].map((x,i) => ({id:'container-'+i,warehouse:x.location.endsWith('仓库')?x.location:x.no.startsWith('BOX')?'生物制造仓库':'白桦树汁仓库',spec:'',...x}));\n  const receipts = [\n    {no:'PR-IN-20261030-001',product:'白桦树汁成品',batch:'PR-BS-20261030',qty:'500 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-01',order:'PO-20261030-005',time:'2026-10-30 10:30',expiry:'2027-04-30'},\n    {no:'PR-IN-20261031-002',product:'白桦树汁成品',batch:'PR-BS-20261031',qty:'300 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-02',order:'-',time:'2026-10-31 10:30',expiry:'2027-03-31'},\n    {no:'PR-IN-20261031-003',product:'生物制造企业成品',batch:'PR-BIO-20261031',qty:'200 瓶',warehouse:'生物制造仓库',location:'成品库 / M-01',order:'-',time:'2026-10-31 11:30',expiry:'2027-05-31'}\n  ];\n  const raw = [{name:'白桦树汁原料',type:'原料',batch:'SAP-20261030',qty:'1066',unit:'kg',tag:'CT-001 / RFID-CT-001',time:'2026-10-30 09:20',warehouse:'白桦树汁仓库',location:'白桦树汁仓库 / 冷藏库 A / A-01 / A-01-01',state:'在库'}];\n  const supply = [{name:'生产用种',type:'农资',batch:'SD-20261030',qty:'1200',unit:'kg',time:'2026-10-30 08:00',warehouse:'香沙芋仓库',location:'香沙芋仓库 / 常温库 B / B-01-01',state:'在库'}];\n  function containerList() { return read('warehouse-containers', containers); }\n  function containerHistory() {\n    return read('warehouse-container-history', [\n      {no:'CO20261029001',containers:['CT-001','CT-003'],action:'新增出库',from:'白桦树汁仓库',to:'采收现场',order:'RW20261029001',time:'2026-10-29 09:20',user:'admin',note:'领用周转桶'},\n      {no:'CI20261030001',containers:['CT-003'],action:'核销入库',from:'采收现场',to:'白桦树汁仓库',order:'RW20261029001',time:'2026-10-30 18:20',user:'李四',note:'已归还'},\n      {no:'CO20261029002',containers:['CT-004','BAG-003','BOX-002'],action:'新增出库',from:'仓库',to:'业务现场',order:'TS20261029002',time:'2026-10-29 10:00',user:'admin',note:'业务领用'}\n    ]);\n  }\n  function deletionReason(x, list = containerList()) {\n    if (x.deleted) return '容器已删除';\n    if (frozen(x.warehouse,'容器',x.location)) return '容器所在范围正在盘点';\n    if (x.status !== '在库') return '仅在库容器可删除';\n    if (x.used || containerHistory().some(h => h.containers.includes(x.no) && !['首次入库','期初入库'].includes(h.action))) return '容器已有使用或流转记录';\n    if (list.some(c => !c.deleted && c.parent === x.no)) return '请先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.object==='原料'?raw:supply);\n      const x=list.find(x=>x.batch===row.batch&&x.warehouse===task.warehouse&&x.location.includes(row.location));\n      if(!x)throw Error('原库存记录已变化，请重新盘点');x.qty=String(quantity);write(key,list);\n    } else if (quantity !== 1) throw Error('容器身份差异需先核实具体容器，不支持直接修改件数');\n  }\n  window.WarehouseState = {read,write,escape,now,types,receipts,raw,supply,containers:containerList,history:containerHistory,deletionReason,flow,productStocks,locations,frozen,moveProduct,stocks,adjust};\n})();\n\n\u003c/script>\u003cscript>\n(function(){\n const S=WarehouseState,E=S.escape,$=id=>document.getElementById(id);let editing=null;\n const defaults=[{id:'WH-BS-001',name:'白桦树汁仓库',type:'仓库',parent:'',capacity:120,unit:'m³',enabled:true,tag:'RFID-WH-001',history:true},{id:'LOC-CA-001',name:'冷藏库 A',type:'库区',parent:'WH-BS-001',capacity:80,unit:'m³',enabled:true,tag:'QR-CA-001',history:true},{id:'BIN-A-01',name:'A-01-01',type:'库位',parent:'LOC-CA-001',capacity:20,unit:'箱',enabled:true,tag:'RFID-BIN-001',history:true},{id:'WH-XS-001',name:'香沙芋仓库',type:'仓库',parent:'',capacity:80,unit:'托',enabled:true,tag:'-',history:true}];\n let nodes=S.read('warehouse-nodes',defaults),types=S.read('warehouse-node-types',[{name:'仓库',level:1,enabled:true},{name:'库区',level:2,enabled:true},{name:'货架',level:3,enabled:true},{name:'库位',level:4,enabled:true}]);const collapsed=new Set();\n const toast=t=>{document.getElementById('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)},persist=()=>S.write('warehouse-nodes',nodes);\n const active=()=>nodes.filter(n=>!n.deleted);const descendants=id=>active().filter(n=>n.parent===id).flatMap(n=>[n,...descendants(n.id)]);\n function stock(n){const list=['农资','原料','产品','容器'].flatMap(o=>S.stocks(o));return list.some(r=>r.qty>0&&((!n.parent&&r.warehouse===n.name)||(r.warehouse+' / '+r.location).includes(n.name)))}\n function deletion(n){if(active().some(c=>c.parent===n.id))return '存在下级节点';if(stock(n))return '当前节点仍有库存';if(n.history||S.read('warehouse-operation-flows',[]).some(f=>f.join(' ').includes(n.name)))return '节点已有历史业务记录';return ''}\n function depth(n){return n.parent?depth(nodes.find(p=>p.id===n.parent))+1:1}\n function render(){const term=$('wKeyword').value.trim(),querying=!!(term||$('wType').value||$('wState').value||$('wTag').value),match=n=>(!term||(n.id+' '+n.name).includes(term))&&(!$('wType').value||n.type===$('wType').value)&&(!$('wState').value||(n.enabled?'启用':'停用')===$('wState').value)&&(!$('wTag').value||n.tag.includes($('wTag').value));\n  function row(n){const children=active().some(c=>c.parent===n.id),reason=deletion(n),level=depth(n);return '\u003ctr class=\"'+(level===1?'parent-row':'')+'\">\u003ctd>\u003cspan style=\"padding-left:'+((level-1)*14)+'px\">'+(children?'\u003cbutton class=\"link\" data-expand=\"'+E(n.id)+'\">'+(collapsed.has(n.id)?'▸':'▾')+'\u003c/button>':'└ ') +level+'级\u003c/span>\u003c/td>'+[n.id,n.name,n.type,nodes.find(p=>p.id===n.parent)?.name||'-',n.capacity+' '+n.unit].map(v=>'\u003ctd>'+E(v)+'\u003c/td>').join('')+'\u003ctd>\u003cspan class=\"tag '+(n.enabled?'green':'gray')+'\">'+(n.enabled?'启用':'停用')+'\u003c/span>\u003c/td>\u003ctd>'+E(n.tag||'-')+'\u003c/td>\u003ctd>\u003cbutton class=\"link\" data-edit=\"'+E(n.id)+'\">编辑\u003c/button>\u003cbutton class=\"link\" data-state=\"'+E(n.id)+'\">'+(n.enabled?'停用':'启用')+'\u003c/button>\u003cbutton class=\"link\" data-delete=\"'+E(n.id)+'\" '+(reason?'disabled title=\"'+E(reason)+'\"':'')+'>删除\u003c/button>\u003c/td>\u003c/tr>'}\n  const walk=parent=>active().filter(n=>n.parent===parent).map(n=>row(n)+(collapsed.has(n.id aceholder=\"待读取\">\u003cbutton class=\"btn\" id=\"readWeighbridgeBtn\">读取地磅\u003c/button>\u003c/div>\u003cspan class=\"hint\">原型模拟设备读数；仅记录本次重量，不自动调整账面库存。\u003c/span>\u003c/div>\n\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 目标仓库\u003c/label>\u003cselect id=\"rebindWarehouse\">\u003c/select>\u003c/div>\n\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 目标库区\u003c/label>\u003cselect id=\"rebindArea\">\u003c/select>\u003c/div>\n\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 目标货架\u003c/label>\u003cselect id=\"rebindRack\">\u003c/select>\u003c/div>\n\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 目标库位\u003c/label>\u003cselect id=\"rebindLocation\">\u003c/select>\u003c/div>\n\u003cdiv class=\"form-item full\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 重新绑定原因\u003c/label>\u003cinput id=\"rebindReason\" maxlength=\"200\">\u003c/div>\n\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"rebindModal\">取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveRebindBtn\">确认重新绑定\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\n(function () {\n  'use strict';\n  const read = (key, fallback) => { try { return JSON.parse(sessionStorage.getItem(key)) ?? structuredClone(fallback); } catch (_) { return structuredClone(fallback); } };\n  const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(value));\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const now = () => new Date().toLocaleString('sv-SE');\n  const types = [{name:'白桦树汁周转桶',level:'可选母子二层',use:'重复利用',enabled:true},{name:'香沙芋采收袋',level:'单层',use:'一次性',enabled:true},{name:'生物制造周转箱',level:'母子二层',use:'重复利用',enabled:true}];\n  const containers = [\n    {no:'CT-GROUP-001',type:types[0].name,parent:'',tag:'-',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-001',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-001',location:'领用现场',order:'RW20261029001',status:'出库-使用中',used:true},\n    {no:'CT-002',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-002',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-003',type:types[0].name,parent:'',tag:'RFID-CT-003',location:'白桦树汁仓库',order:'-',status:'在库',used:true},\n    {no:'CT-004',type:types[0].name,parent:'',tag:'-',location:'运输现场',order:'TS20261029002',status:'待归还',used:true},\n    {no:'BAG-001',type:types[1].name,parent:'',tag:'QR-BAG-001',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-002',type:types[1].name,parent:'',tag:'-',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-003',type:types[1].name,parent:'',tag:'-',location:'采收现场',order:'RW20261028003',status:'待归还',used:true},\n    {no:'BOX-001',type:types[2].name,parent:'',tag:'RFID-BOX-001',location:'维护区',order:'-',status:'维护中',used:true},\n    {no:'BOX-002',type:types[2].name,parent:'',tag:'RFID-BOX-002',location:'生产现场',order:'PO20261028001',status:'出库-使用中',used:true},\n    {no:'BOX-003',type:types[2].name,parent:'',tag:'-',location:'生物制造仓库',order:'-',status:'在库',used:false}\n  ].map((x,i) => ({id:'container-'+i,warehouse:x.location.endsWith('仓库')?x.location:x.no.startsWith('BOX')?'生物制造仓库':'白桦树汁仓库',spec:'',...x}));\n  const receipts = [\n    {no:'PR-IN-20261030-001',product:'白桦树汁成品',batch:'PR-BS-20261030',qty:'500 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-01',order:'PO-20261030-005',time:'2026-10-30 10:30',expiry:'2027-04-30'},\n    {no:'PR-IN-20261031-002',product:'白桦树汁成品',batch:'PR-BS-20261031',qty:'300 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-02',order:'-',time:'2026-10-31 10:30',expiry:'2027-03-31'},\n    {no:'PR-IN-20261031-003',product:'生物制造企业成品',batch:'PR-BIO-20261031',qty:'200 瓶',warehouse:'生物制造仓库',location:'成品库 / M-01',order:'-',time:'2026-10-31 11:30',expiry:'2027-05-31'}\n  ];\n  const raw = [{name:'白桦树汁原料',type:'原料',batch:'SAP-20261030',qty:'1066',unit:'kg',tag:'CT-001 / RFID-CT-001',time:'2026-10-30 09:20',warehouse:'白桦树汁仓库',location:'白桦树汁仓库 / 冷藏库 A / A-01 / A-01-01',state:'在库'}];\n  const supply = [{name:'生产用种',type:'农资',batch:'SD-20261030',qty:'1200',unit:'kg',time:'2026-10-30 08:00',warehouse:'香沙芋仓库',location:'香沙芋仓库 / 常温库 B / B-01-01',state:'在库'}];\n  function containerList() { return read('warehouse-containers', containers); }\n  function containerHistory() {\n    return read('warehouse-container-history', [\n      {no:'CO20261029001',containers:['CT-001','CT-003'],action:'新增出库',from:'白桦树汁仓库',to:'采收现场',order:'RW20261029001',time:'2026-10-29 09:20',user:'admin',note:'领用周转桶'},\n      {no:'CI20261030001',containers:['CT-003'],action:'核销入库',from:'采收现场',to:'白桦树汁仓库',order:'RW20261029001',time:'2026-10-30 18:20',user:'李四',note:'已归还'},\n      {no:'CO20261029002',containers:['CT-004','BAG-003','BOX-002'],action:'新增出库',from:'仓库',to:'业务现场',order:'TS20261029002',time:'2026-10-29 10:00',user:'admin',note:'业务领用'}\n    ]);\n  }\n  function deletionReason(x, list = containerList()) {\n    if (x.deleted) return '容器已删除';\n    if (frozen(x.warehouse,'容器',x.location)) return '容器所在范围正在盘点';\n    if (x.status !== '在库') return '仅在库容器可删除';\n    if (x.used || containerHistory().some(h => h.containers.includes(x.no) && !['首次入库','期初入库'].includes(h.action))) return '容器已有使用或流转记录';\n    if (list.some(c => !c.deleted && c.parent === x.no)) return '请先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.object==='原料'?raw:supply);\n      const x=list.find(x=>x.batch===row.batch&&x.warehouse===task.warehouse&&x.location.includes(row.location));\n      if(!x)throw Error('原库存记录已变化，请重新盘点');x.qty=String(quantity);write(key,list);\n    } else if (quantity !== 1) throw Error('容器身份差异需先核实具体容器，不支持直接修改件数');\n  }\n  window.WarehouseState = {read,write,escape,now,types,receipts,raw,supply,containers:containerList,history:containerHistory,deletionReason,flow,productStocks,locations,frozen,moveProduct,stocks,adjust};\n})();\n\n\u003c/script>\u003cscript>\nconst route=new URL(window.__warehouseLocation.href),object=route.searchParams.get('object'),warehouseMode=route.searchParams.get('view')==='warehouse'||!object;\nconst names={supply:'农资',raw:'原料',product:'产品',container:'容器'};let currentNode='',selectedItems=[];\nconst warehouseRows=[{id:'w1',parent:'',level:1,n  => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\n\u003cmain class=\"content\">\u003cdiv class=\"crumb\">智能仓储 / 容器管理 / 容器档案\u003c/div>\u003cdiv class=\"head\">\u003cdiv>\u003ch1>容器档案\u003c/h1>\u003cp>维护具体容器、母子关系与管理信息；使用明细在容器台账查看\u003c/p>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"typeBtn\">容器类型设置\u003c/button>\u003cbutton class=\"btn\" id=\"importBtn\">批量导入\u003c/button>\u003cbutton class=\"btn\" id=\"batchBtn\">批量维护\u003c/button>\u003cbutton class=\"btn primary\" id=\"addBtn\">+ 新增容器\u003c/button>\u003c/div>\u003c/div>\n\u003csection class=\"panel\">\u003cdiv class=\"query\">\u003cdiv class=\"form-item\">\u003clabel>容器编号\u003c/label>\u003cinput id=\"qNo\" placeholder=\"请输入编号\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>容器类型\u003c/label>\u003cselect id=\"qType\">\u003coption value=\"\">全部\u003c/option>\u003coption>白桦树汁周转桶\u003c/option>\u003coption>香沙芋采收袋\u003c/option>\u003coption>生物制造周转箱\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>当前状态\u003c/label>\u003cselect id=\"qStatus\">\u003coption value=\"\">全部\u003c/option>\u003coption>在库\u003c/option>\u003coption>出库-使用中\u003c/option>\u003coption>待归还\u003c/option>\u003coption>维护中\u003c/option>\u003coption>已报废\u003c/option>\u003coption>已停用\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"query-actions\">\u003cbutton class=\"btn primary\" id=\"searchBtn\">查询\u003c/button>\u003cbutton class=\"btn\" id=\"resetBtn\">重置\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"data-table\" 3cselect id=\"editParent\">\u003coption value=\"\">无，作为一级容器\u003c/option>\u003coption>CT-GROUP-001\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>标签编号（非必填）\u003c/label>\u003cinput id=\"editTag\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>入库仓库\u003c/label>\u003cselect id=\"editWarehouse\">\u003c/select>\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>规格（非必填）\u003c/label>\u003cinput id=\"editSpec\" placeholder=\"如：50L\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"editModal\">取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveContainerBtn\">保存\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"importModal\">\u003cdiv class=\"modal\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\">批量导入容器\u003c/span>\u003cbutton class=\"close\" data-close=\"importModal\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"file-box\">\u003cinput id=\"importFile\" type=\"file\" accept=\".csv\">\u003cp>UTF-8 CSV，首行为表头：容器类型、容器编号、上级容器、标签编号、规格、仓库\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"importModal\">取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveImportBtn\">开始导入\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"batchModal\">\u003cdiv class=\"modal\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\">批量维护容器\u003c/span>\u003cbutton class=\"close\" data-close=\"batchModal\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"form-item\">\u003clabel>已选容器\u003c/label>\u003cinput id=\"batchCount\" readonly>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 批量操作\u003c/label>\u003cselect id=\"batchAction\">\u003coption>启用\u003c/option>\u003coption>停用\u003c/option>\u003coption>变更类型\u003c/option>\u003coption>绑定标签\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>维护说明（非必填）\u003c/label>\u003cinput id=\"batchNote\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"batchModal\">取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveBatchBtn\">确认\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\n(function () {\n  'use strict';\n  const read = (key, fallback) => { try { return JSON.parse(sessionStorage.getItem(key)) ?? structuredClone(fallback); } catch (_) { return structuredClone(fallback); } };\n  const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(value));\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const now = () => new Date().toLocaleString('sv-SE');\n  const types = [{name:'白桦树汁周转桶',level:'可选母子二层',use:'重复利用',enabled:true},{name:'香沙芋采收袋',level:'单层',use:'一次性',enabled:true},{name:'生物制造周转箱',level:'母子二层',use:'重复利用',enabled:true}];\n  const containers = [\n    {no:'CT-GROUP-001',type:types[0].name,parent:'',tag:'-',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-001',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-001',location:'领用现场',order:'RW20261029001',status:'出库-使用中',used:true},\n    {no:'CT-002',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-002',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-003',type:types[0].name,parent:'',tag:'RFID-CT-003',location:'白桦树汁仓库',order:'-',status:'在库',used:true},\n    {no:'CT-004',type:types[0].name,parent:'',tag:'-',location:'运输现场',order:'TS20261029002',status:'待归还',used:true},\n    {no:'BAG-001',type:types[1].name,parent:'',tag:'QR-BAG-001',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-002',type:types[1].name,parent:'',tag:'-',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-003',type:types[1].name,parent:'',tag:'-',location:'采收现场',order:'RW20261028003',status:'待归还',used:true},\n    {no:'BOX-001',type:types[2].name,parent:'',tag:'RFID-BOX-001',location:'维护区',order:'-',status:'维护中',used:true},\n    {no:'BOX-002',type:types[2].name,parent:'',tag:'RFID-BOX-002',location:'生产现场',order:'PO20261028001',status:'出库-使用中',used:true},\n    {no:'BOX-003',type:types[2].name,parent:'',tag:'-',location:'生物制造仓库',order:'-',status:'在库',used:false}\n  ].map((x,i) => ({id:'container-'+i,warehouse:x.location.endsWith('仓库')?x.location:x.no.startsWith('BOX')?'生物制造仓库':'白桦树汁仓库',spec:'',...x}));\n  const receipts = [\n    {no:'PR-IN-20261030-001',product:'白桦树汁成品',batch:'PR-BS-20261030',qty:'500 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-01',order:'PO-20261030-005',time:'2026-10-30 10:30',expiry:'2027-04-30'},\n    {no:'PR-IN-20261031-002',product:'白桦树汁成品',batch:'PR-BS-20261031',qty:'300 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-02',order:'-',time:'2026-10-31 10:30',expiry:'2027-03-31'},\n    {no:'PR-IN-20261031-003',product:'生物制造企业成品',batch:'PR-BIO-20261031',qty:'200 瓶',warehouse:'生物制造仓库',location:'成品库 / M-01',order:'-',time:'2026-10-31 11:30',expiry:'2027-05-31'}\n  ];\n  const raw = [{name:'白桦树汁原料',type:'原料',batch:'SAP-20261030',qty:'1066',unit:'kg',tag:'CT-001 / RFID-CT-001',time:'2026-10-30 09:20',warehouse:'白桦树汁仓库',location:'白桦树汁仓库 / 冷藏库 A / A-01 / A-01-01',state:'在库'}];\n  const supply = [{name:'生产用种',type:'农资',batch:'SD-20261030',qty:'1200',unit:'kg',time:'2026-10-30 08:00',warehouse:'香沙芋仓库',location:'香沙芋仓库 / 常温库 B / B-01-01',state:'在库'}];\n  function containerList() { return read('warehouse-containers', containers); }\n  function containerHistory() {\n    return read('warehouse-container-history', [\n      {no:'CO20261029001',containers:['CT-001','CT-003'],action:'新增出库',from:'白桦树汁仓库',to:'采收现场',order:'RW20261029001',time:'2026-10-29 09:20',user:'admin',note:'领用周转桶'},\n      {no:'CI20261030001',containers:['CT-003'],action:'核销入库',from:'采收现场',to:'白桦树汁仓库',order:'RW20261029001',time:'2026-10-30 18:20',user:'李四',note:'已归还'},\n      {no:'CO20261029002',containers:['CT-004','BAG-003','BOX-002'],action:'新增出库',from:'仓库',to:'业务现场',order:'TS20261029002',time:'2026-10-29 10:00',user:'admin',note:'业务领用'}\n    ]);\n  }\n  function deletionReason(x, list = containerList()) {\n    if (x.deleted) return '容器已删除';\n    if (frozen(x.warehouse,'容器',x.location)) return '容器所在范围正在盘点';\n    if (x.status !== '在库') return '仅在库容器可删除';\n    if (x.used || containerHistory().some(h => h.containers.includes(x.no) && !['首次入库','期初入库'].includes(h.action))) return '容器已有使用或流转记录';\n    if (list.some(c => !c.deleted && c.parent === x.no)) return '请先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.object==='原料'?raw:supply);\n      const x=list.find(x=>x.batch===row.batch&&x.warehouse===task.warehouse&&x.location.includes(row.location));\n      if(!x)throw Error('原库存记录已变化，请重新盘点');x.qty=String(quantity);write(key,list);\n    } else if (quantity !== 1) throw Error('容器身份差异需先核实具体容器，不支持直接修改件数');\n  }\n  window.WarehouseState = {read,write,escape,now,types,receipts,raw,supply,containers:containerList,history:containerHistory,deletionReason,flow,productStocks,locations,frozen,moveProduct,stocks,adjust};\n})();\n\n\u003c/script>\u003cscript>\n(function () {\n  const S=WarehouseState,E=S.escape,$=id=>document.getElementById(id);\n  let containers=S.containers(),types=S.read('warehouse-container-types',S.types),editing=null,draftTypes=[];\n  const selected=new Set(),collapsed=new Set();\n  function tell(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}\n  function open(id){$(id).classList.add('show')}function close(id){$(id).classList.remove('show')}\n  function persist(){S.write('warehouse-containers',containers);render()}\n  function options(){const enabled=types.filter(x=>x.enabled).map(x=>x.name);$('qType').innerHTML='\u003coption value=\"\">全部\u003c/option>'+types.map(x=>'\u003coption>'+E(x.name)+'\u003c/option>').join('');$('editType').innerHTML=enabled.map(x=>'\u003coption>'+E(x)+'\u003c/option>').join('')}\n  function reason(x){return S.deletionReason(x,containers)}\n  function render(){\n    const list=containers.filter(x=>!x.deleted),match=x=>(!$('qNo').value||x.no.includes($('qNo').value))&&(!$('qType').value||x.type===$('qType').value)&&(!$('qStatus').value||x.status===$('qStatus').value);\n    cons 桦树汁仓库 / 冷藏库 A\u003c/option>\u003coption>核销入库区\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>筛选可操作容器\u003c/label>\u003cinput id=\"pickFilter\" placeholder=\"输入容器编号或类型\">\u003c/div>\u003c/div>\u003cdiv class=\"pick-list\">\u003cdiv class=\"pick-row head\">\u003cspan>\u003c/span>\u003cspan>容器编号\u003c/span>\u003cspan>容器类型\u003c/span>\u003cspan>当前位置/业务\u003c/span>\u003cspan>当前状态\u003c/span>\u003c/div>\u003cdiv id=\"pickRows\">\u003c/div>\u003c/div>\u003cdiv class=\"selected-summary\" id=\"selectedSummary\">已选择 0 个容器\u003c/div>\u003cdiv class=\"form-item\" style=\"margin-top:12px\">\u003clabel>操作说明（非必填）\u003c/label>\u003cinput id=\"operationNote\">\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close=\"operationModal\">取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveOperationBtn\">确认提交\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"detailModal\">\u003cdiv class=\"modal wide\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\">业务单详情\u003c/span>\u003cbutton class=\"close\" data-close=\"detailModal\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv id=\"orderDetail\">\u003c/div>\u003ch4>容器明细\u003c/h4>\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>容器编号\u003c/th>\u003cth>容器类型\u003c/th>\u003cth>操作前状态\u003c/th>\u003cth>操作后状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"orderDetailRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn primary\" data-close=\"detailModal\">关闭\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\n(function () {\n  'use strict';\n  const read = (key, fallback) => { try { return JSON.parse(sessionStorage.getItem(key)) ?? structuredClone(fallback); } catch (_) { return structuredClone(fallback); } };\n  const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(va o, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toStrin tton>').join('') + '\u003c/div>\u003c/div>'; }).join('') + '\u003c/div>';\n  host.querySelectorAll('[data-route]').forEach(button => button.onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\u003cscript>\n(function () {\n  'use strict';\n  const read = (key, fallback) => { try { return JSON.parse(sessionStorage.getItem(key)) ?? structuredClone(fallback); } catch (_) { return structuredClone(fallback); } };\n  const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(value));\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const now = () => new Date().toLocaleString('sv-SE');\n  const types = [{name:'白桦树汁周转桶',level:'可选母子二层',use:'重复利用',enabled:true},{name:'香沙芋采收袋',level:'单层',use:'一次性',enabled:true},{name:'生物制造周转箱',level:'母子二层',use:'重复利用',enabled:true}];\n  const containers = [\n    {no:'CT-GROUP-001',type:types[0].name,parent:'',tag:'-',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-001',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-001',location:'领用现场',order:'RW20261029001',status:'出库-使用中',used:true},\n    {no:'CT-002',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-002',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-003',type:types[0].name,parent:'',tag:'RFID-CT-003',location:'白桦树汁仓库',order:'-',status:'在库',used:true},\n    {no:'CT-004',type:types[0].name,parent:'',tag:'-',location:'运输现场',order:'TS20261029002',status:'待归还',used:true},\n    {no:'BAG-
