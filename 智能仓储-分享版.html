se-report.html?view=difference\"],[\"发货报表\",\"warehouse-report.html?view=shipping\"]]]];\n  const current = new URL(window.__warehouseRouteUrl);\n  const matches = route => { const target = new URL(route, window.__warehouseRouteUrl); return target.pathname === current.pathname && ['object','view'].every(k => target.searchParams.get(k) === current.searchParams.get(k)); };\n  let closed = []; try { closed = JSON.parse(sessionStorage.getItem('warehouse-closed-menus') || '[]'); } catch (_) {}\n  host.innerHTML = '\u003cdiv class=\"side-group\">\u003cdiv class=\"side-title\">智能仓储\u003c/div>' + menu.map(([title, children], index) => { const active = children.some(([,route]) => matches(route)); return '\u003cdiv class=\"side-section ' + (!closed.includes(title) || active ? 'expanded' : '') + '\">\u003cbutton class=\"nav section-title ' + (active ? 'active' : '') + '\" data-group=\"' + index + '\">' + title + '\u003c/button>\u003cdiv class=\"side-children\">' + children.map(([label,route]) => '\u003cbutton class=\"nav ' + (matches(route) ? 'active' : '') + '\" data-route=\"' + route + '\">' + label + '\u003c/button>').join('') + '\u003c/div>\u003c/div>'; }).join('') + '\u003c/div>';\n  host.querySelectorAll('[data-route]').forEach(button => button.onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\n\u003cmain class=\"content\">\u003cdiv class=\"crumb\">智能仓储 / 农资管理 / 农资入库\u003c/div>\u003cdiv class=\"head\">\u003cdiv>\u003ch1>农资入库\u003c/h1>\u003cp>按农资分类办理入库；生产用种入库保留品种、来源和质量信息\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" id=\"addBtn\">+ 新增入库\u003c/button>\u003c/div>\u003csection class=\"panel\">\u003cdiv class=\"query\">\u003cdiv class=\"form-item\">\u003clabel>入库单号\u003c/label>\u003cinput id=\"qNo\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>农资分类\u003c/label>\u003cselect id=\"qCategory\">\u003coption value=\"\">全部\u003c/option>\u003coption>生产用种\u003c/option>\u003coption>种质保存材料\u003c/option>\u003coption>肥料\u003c/option>\u003coption>农药\u003c/option>\u003coption>土壤改良剂\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>农资名称\u003c/label>\u003cinput id=\"qName\">\u003c/div>\u003cdiv class=\"query-actions\">\u003cbutton class=\"btn primary\" id=\"searchBtn\">查询\u003c/button>\u003c/div>\u003c/div>\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>入库单号\u003c/th>\u003cth>分类\u003c/th>\u003cth>农资名称\u003c/th>\u003cth>批次\u003c/th>\u003cth>数量\u003c/th>\u003cth>仓库节点\u003c/th>\u003cth>生产日期\u003c/th>\u003cth>到期日期\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/section>\u003c/main>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-mask\" id=\"modal\">\u003cdiv class=\"modal wide\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\">新增农资入库\u003c/span>\u003cbutton class=\"close\" data-close>×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\" id=\"modalBody\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 农资分类\u003c/label>\u003cselect id=\"category\">\u003coption>生产用种\u003c/option>\u003coption>种质保存材料\u003c/option>\u003coption>肥料\u003c/option>\u003coption>农药\u003c/option>\u003coption>土壤改良剂\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 农资名称\u003c/label>\u003cselect id=\"itemName\">\u003c/select>\u003c/div>\u003cdiv class=\"form-item germplasm-field\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 种质档案编号\u003c/label>\u003cinput id=\"germplasmCode\" placeholder=\"关联种质资源档案编号\">\u003c/div>\u003cdiv class=\"form-item germplasm-field\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 保存份型\u003c/label>\u003cselect id=\"portionType\">\u003coption>密封备份份\u003c/option>\u003coption>使用供繁育份\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item germplasm-field\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 含水量（≤13%）\u003c/label>\u003cinput id=\"moisture\" type=\"number\" min=\"0\" max=\"13\" step=\"0.1\">\u003c/div>\u003cdiv class=\"form-item germplasm-field\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 发芽率（≥85%）\u003c/label>\u003cinput id=\"germinationRate\" type=\"number\" min=\"85\" max=\"100\">\u003c/div>\u003cdiv class=\"form-item seed-field\">\u003clabel>生产用种品种\u003c/label>\u003cinput id=\"variety\" value=\"香沙芋\">\u003c/div>\u003cdiv class=\"form-item seed-field\">\u003clabel>生产用种来源\u003c/label>\u003cinput id=\"source\" placeholder=\"供应基地/育种单位\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 入库批次\u003c/label>\u003cinput id=\"batch\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 入库数量\u003c/label>\u003cinput id=\"qty\" type=\"number\" min=\"1\">\u003c/div>\u003cdiv class=\"form-item full seed-field\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 电子秤称重\u003c/label>\u003cdiv class=\"scale-box\">\u003cspan>设备 WS-01 · 在线\u003c/span>\u003cinput id=\"scaleWeight\" readonly placeholder=\"读取后回填 kg\">\u003cbutton class=\"btn\" type=\"button\" id=\"readScaleBtn\">读取电子秤\u003c/button>\u003cspan class=\"scale-state\" id=\"scaleState\">待采集\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 仓库节点\u003c/label>\u003cselect id=\"warehouse\">\u003coption>农资库 / A-01\u003c/option>\u003coption>生产用种库 / S-01\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>生产日期（非必填）\u003c/label>\u003cinput id=\"produceDate\" type=\"date\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>到期日期（自动计算）\u003c/label>\u003cinput id=\"expiryDate\" readonly>\u003c/div>\u003cdiv class=\"form-item seed-field\">\u003clabel>质量等级（非必填）\u003c/label>\u003cselect id=\"quality\">\u003coption>一级\u003c/option>\u003coption>二级\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close>取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveBtn\">确认入库\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\n(function () {\n  'use strict';\n  const read = (key, fallback) => { try { return JSON.parse(sessionStorage.getItem(key)) ?? structuredClone(fallback); } catch (_) { return structuredClone(fallback); } };\n  const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(value));\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const now = () => new Date().toLocaleString('sv-SE');\n  const types = [{name:'白桦树汁周转桶',level:'可选母子二层',use:'重复利用',enabled:true},{name:'香沙芋采收袋',level:'单层',use:'一次性',enabled:true},{name:'生物制造周转箱',level:'母子二层',use:'重复利用',enabled:true}];\n  const containers = [\n    {no:'CT-GROUP-001',type:types[0].name,parent:'',tag:'-',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-001',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-001',location:'领用现场',order:'RW20261029001',status:'出库-使用中',used:true},\n    {no:'CT-002',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-002',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-003',type:types[0].name,parent:'',tag:'RFID-CT-003',location:'白桦树汁仓库',order:'-',status:'在库',used:true},\n    {no:'CT-004',type:types[0].name,parent:'',tag:'-',location:'运输现场',order:'TS20261029002',status:'待归还',used:true},\n    {no:'BAG-001',type:types[1].name,parent:'',tag:'QR-BAG-001',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-002',type:types[1].name,parent:'',tag:'-',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-003',type:types[1].name,parent:'',tag:'-',location:'采收现场',order:'RW20261028003',status:'待归还',used:true},\n    {no:'BOX-001',type:types[2].name,parent:'',tag:'RFID-BOX-001',location:'维护区',order:'-',status:'维护中',used:true},\n    {no:'BOX-002',type:types[2].name,parent:'',tag:'RFID-BOX-002',location:'生产现场',order:'PO20261028001',status:'出库-使用中',used:true},\n    {no:'BOX-003',type:types[2].name,parent:'',tag:'-',location:'生物制造仓库',order:'-',status:'在库',used:false}\n  ].map((x,i) => ({id:'container-'+i,warehouse:x.location.endsWith('仓库')?x.location:x.no.startsWith('BOX')?'生物制造仓库':'白桦树汁仓库',spec:'',...x}));\n  const receipts = [\n    {no:'PR-IN-20261030-001',product:'白桦树汁成品',batch:'PR-BS-20261030',qty:'500 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-01',order:'PO-20261030-005',time:'2026-10-30 10:30',expiry:'2027-04-30'},\n    {no:'PR-IN-20261031-002',product:'白桦树汁成品',batch:'PR-BS-20261031',qty:'300 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-02',order:'-',time:'2026-10-31 10:30',expiry:'2027-03-31'},\n    {no:'PR-IN-20261031-003',product:'生物制造企业成品',batch:'PR-BIO-20261031',qty:'200 瓶',warehouse:'生物制造仓库',location:'成品库 / M-01',order:'-',time:'2026-10-31 11:30',expiry:'2027-05-31'}\n  ];\n  const raw = [{name:'白桦树汁原料',type:'原料',batch:'SAP-20261030',qty:'1066',unit:'kg',tag:'CT-001 / RFID-CT-001',time:'2026-10-30 09:20',warehouse:'白桦树汁仓库',location:'白桦树汁仓库 / 冷藏库 A / A-01 / A-01-01',state:'在库'}];\n  const supply = [{name:'生产用种',type:'农资',batch:'SD-20261030',qty:'1200',unit:'kg',time:'2026-10-30 08:00',warehouse:'香沙芋仓库',location:'香沙芋仓库 / 常温库 B / B-01-01',state:'在库'}];\n  function containerList() { return read('warehouse-containers', containers); }\n  function containerHistory() {\n    return read('warehouse-container-history', [\n      {no:'CO20261029001',containers:['CT-001','CT-003'],action:'新增出库',from:'白桦树汁仓库',to:'采收现场',order:'RW20261029001',time:'2026-10-29 09:20',user:'admin',note:'领用周转桶'},\n      {no:'CI20261030001',containers:['CT-003'],action:'核销入库',from:'采收现场',to:'白桦树汁仓库',order:'RW20261029001',time:'2026-10-30 18:20',user:'李四',note:'已归还'},\n      {no:'CO20261029002',containers:['CT-004','BAG-003','BOX-002'],action:'新增出库',from:'仓库',to:'业务现场',order:'TS20261029002',time:'2026-10-29 10:00',user:'admin',note:'业务领用'}\n    ]);\n  }\n  function deletionReason(x, list = containerList()) {\n    if (x.deleted) return '容器已删除';\n    if (frozen(x.warehouse,'容器',x.location)) return '容器所在范围正在盘点';\n    if (x.status !== '在库') return '仅在库容器可删除';\n    if (x.used || containerHistory().some(h => h.containers.includes(x.no) && !['首次入库','期初入库'].includes(h.action))) return '容器已有使用或流转记录';\n    if (list.some(c => !c.deleted && c.parent === x.no)) return '请先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')) ).join('') + '\u003c/div>\u003c/div>'; }).join('') + '\u003c/div>';\n  host.querySelectorAll('[data-route]').forEach(button => button.onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\u003cscript>\n(function () {\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  window.WarehouseCategorySettings = function (options) {\n    const categories = options.presets.map(name => ({name, builtin:true, enabled:true}));\n    const modal = document.getElementById(options.modal);\n    const rows = modal.querySelector('tbody');\n    let editIndex = -1;\n    let draft = '';\n    const notify = options.notify;\n    function changed() { options.onChange(categories); }\n    function render() {\n      rows.innerHTML = categories.map((x, i) => '\u003ctr>\u003ctd>' + (editIndex === i ? '\u003cinput aria-label=\"分类名称\" value=\"' + escape(draft) + '\">' : escape(x.name)) + '\u003c/td>\u003ctd>' + (x.builtin ? '系统预置' : '项目自定义') + '\u003c/td>\u003ctd>\u003cspan class=\"tag ' + (x.enabled ? 'green' : 'gray') + '\">' + (x.enabled ? '启用' : '停用') + '\u003c/span>\u003c/td>\u003ctd>' + (editIndex === i ? '\u003cbutton class=\"link\" data-save=\"' + i + '\">保存\u003c/button>\u003cbutton class=\"link\" data-cancel>取消\u003c/button>' : '\u003cbutton class=\"link\" data-toggle=\"' + i + '\">' + (x.enabled ? '停用' : '启用') + '\u003c/button>' + (x.builtin ? '' : '\u003cbutton class=\"link\" data-edit=\"' + i + '\">编辑\u003c/button>\u003cbutton class=\"link\"  => {\n      if (editIndex !== -1) return notify('请先保存或取消当前编辑行');\n      editIndex=categories.length; draft=''; render(); rows.querySelector('input').focus();\n    };\n    modal.querySelectorAll('[data-close]').forEach(button => button.onclick = () => { editIndex=-1; modal.classList.remove('show'); });\n    this.open = () => { editIndex=-1; render(); modal.classList.add('show'); };\n    this.categories = categories;\n  };\n  window.warehouseEscape = escape;\n})();\n\n\u003c/script>\u003cscript>const raws=[{code:'RM-BS-001',name:'白桦树汁原料',category:'农产品原料',spec:'鲜汁',unit:'kg',batch:'是',expiry:'是',pieceWeight:'1',tareWeight:'0.2',location:'白桦树汁仓库 / 冷藏库 A / A-01-01',status:'启用'},{code:'RM-PK-001',name:'PET 瓶',category:'包装材料',spec:'300ml',unit:'个',batch:'是',expiry:'否',status:'启用'},{code:'RM-AUX-001',name:'食品级清洁剂',category:'辅料',spec:'5L',unit:'桶',batch:'否',expiry:'是',status:'停用'}];let category='',editing=null;function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}function render(){rawRows.innerHTML=raws.filter(x=>(!category||x.category===category)&&(!qKeyword.value.trim()||x.name.includes(qKeyword.value.trim())||x.code.includes(qKeyword.value.trim()))&&(!qBatch.value||x.batch===qBatch.value)&&(!qStatus.value||x.status===qStatus.value)).map(x=>'\u003ctr>\u003ctd>'+x.code+'\u003c/td>\u003ctd>'+x.name+'\u003c/td>\u003ctd>'+x.category+'\u003c/td>\u003ctd>'+x.spec+'\u003c/td>\u003ctd>'+x.unit+'\u003c/td>\u003ctd>'+x.batch+'\u003c/td>\u003ctd>'+x.expiry+'\u003c/td>\u003ctd>\u003cspan class=\"tag '+(x.status==='启用'?'green':'gray')+'\">'+x.status+'\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"link\" data-edit=\"'+x.code+'\">编辑\u003c/button>\u003cbutton class=\"link\" data-toggle=\"'+x.code+'\">'+(x.status==='启用'?'停用':'启用')+'\u003c/button>\u003cbutton class=\"link d=\"warehouseNav\">\u003c/aside>\u003cmain class=\"content\">\u003cdiv class=\"crumb\">智能仓储 / 原料管理 / 原料入库\u003c/div>\u003cdiv class=\"head\">\u003cdiv>\u003ch1>原料入库\u003c/h1>\u003cp>关联采购到货，支持称重、差异处理和推荐存放位置\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" id=\"addBtn\">+ 新增入库\u003c/button>\u003c/div>\u003csection class=\"panel\">\u003cdiv class=\"query\">\u003cdiv class=\"form-item\">\u003clabel>入库单号\u003c/label>\u003cinput id=\"qNo\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>原料名称\u003c/label>\u003cinput id=\"qName\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>批次\u003c/label>\u003cinput id=\"qBatch\">\u003c/div>\u003cdiv class=\"query-actions\">\u003cbutton class=\"btn primary\" id=\"searchBtn\">查询\u003c/button>\u003cbutton class=\"btn\" id=\"resetBtn\">重置\u003c/button>\u003c/div>\u003c/div>\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>入库单号\u003c/th>\u003cth>原料\u003c/th>\u003cth>批次\u003c/th>\u003cth>来源\u003c/th>\u003cth>单据数量\u003c/th>\u003cth>最终接收数量\u003c/th>\u003cth>差异处理\u003c/th>\u003cth>存放位置\u003c/th>\u003cth>入库时间\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/section>\u003c/main>\u003c/div>\u003c/div>\u003cdiv class=\"modal-mask\" id=\"modal\">\u003cdiv class=\"modal wide\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\">新增原料入库\u003c/span>\u003cbutton class=\"close\" data-close>×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"form-item\">\u003clabel>采购单（非必填）\u003c/label>\u003cselect id=\"purchase\">\u003coption>不关联采购单\u003c/option>\u003coption>PO20261030001 / 白桦树汁原料\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 原料\u003c/label>\u003cselect id=\"material\">\u003coption value=\"sap\">白桦树汁原料\u003c/option>\u003coption value=\"pet\">PET 瓶\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 来源/供应商\u003c/label>\u003cinput id=\"source\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 入库批次\u003c/label>\u003cinput id=\"batch\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 单据数量\u003c/label>\u003cinput id=\"docQty\" type=\"number\" min=\"0\" step=\"0.1\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>计量单位（自动带出）\u003c/label>\u003cinput id=\"unit\" value=\"kg\" readonly>\u003c/div>\u003cdiv class=\"form-item full\" id=\"scaleField\">\u003clabel>电子秤称重\u003c/label>\u003cdiv class=\"scale-box\">\u003cspan>设备 WS-01 · 在线\u003c/span>\u003cinput id=\"actualQty\" readonly placeholder=\"读取后回填实收数量\">\u003cbutton class=\"btn\" type=\"button\" id=\"readScaleBtn\">读取电子秤\u003c/button>\u003cspan id=\"scaleState\">待采集\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"form-item\" id=\"manualActualField\" style=\"display:none\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 实收数量\u003c/label>\u003cinput id=\"manualActual\" type=\"number\" min=\"0\" step=\"0.1\">\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>推荐存放位置\u003c/label>\u003cdiv class=\"recommend-box\">\u003cstrong id=\"recommendText\">白桦树汁仓库 / 冷藏库 A / A-01-01\u003c/strong>\u003cspan> · 同原料位置、启用节点、可用容量符合\u003c/span>\u003cbutton class=\"btn small\" type=\"button\" id=\"useRecommendBtn\">采用推荐位置\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>最终存放位置\u003c/label>\u003cselect id=\"location\">\u003coption>暂不上架\u003c/option>\u003coption>白桦树汁仓库 / 冷藏库 A / A-01-01\u003c/option>\u003coption>生物制造仓库 / 原料库 / R-01-02\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>RFID标签（非必填）\u003c/label>\u003cdiv style=\"display:flex;gap:8px\">\u003cinput id=\"rfid\">\u003cbutton class=\"btn\" type=\"button\" id=\"readRfidBtn\">读取RFID\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"form-item full diff-box ok\" id=\"diffBox\"> cludes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.object==='原料'?raw:supply);\n      const x=list.find(x=>x.batch===row.batch&&x.warehouse===task.warehouse&&x.location.includes(row.location));\n      if(!x)throw Error('原库存记录已变化，请重新盘点');x.qty=String(quantity);write(key,list);\n    } else if (quantity !== 1) throw Error('容器身份差异需先核实具体容器，不支持直接修改件数');\n  }\n  window.WarehouseState = {read,write,escape,now,types,receipts,raw,supply,containers:containerList,history:containerHistory,deletionReason,flow,productStocks,locations,frozen,moveProduct,stocks,adjust};\n})();\n\n\u003c/script>\u003cscript>const records=[{no:'RM-IN-20261030-001',name:'白桦树汁原料',batch:'SAP-20261030',source:'白桦树汁采集企业',doc:'1,200 kg',actual:'1,186 kg',diff:'短收待补交',location:'白桦树汁仓库 / 冷藏库 A',time:'2026-10-30 09:20'}];function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}function render(){let n=qNo.value.trim(),name=qName.value.trim(),b=qBatch.value.trim();rows.innerHTML=records.filter(x=>(!n||x.no.includes(n))&&(!name||x.name.includes(name))&&(!b||x.batch.includes(b))).map(x=>'\u003ctr>\u003ctd>'+x.no+'\u003c/td>\u003ctd>'+x.name+'\u003c/td>\u003ctd>'+x.batch+'\u003c/td>\u003ctd>'+x.source+'\u003c/td>\u003ctd>'+x.doc+'\u003c/td>\u003ctd>'+x.actual+'\u003c/td>\u003ctd>'+x.diff+'\u003c/td>\u003ctd>'+x.location+'\u003c/td>\u003ctd>'+x.time+'\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"toastMsg(\\'已打开入库详情\\')\">详情\u003c/button>\u003c/td>\u003c/tr>').join('')||'\u003ctr>\u003ctd colspan=\"10\" style=\"text-align:center\">暂无入库记录\u003c/td>\u003c/tr>'}function syncMaterial(){let weighted=material.value==='sap';unit.value=weighted?'kg':'个';scaleField.style.display=weighted?'flex':'none';manualActualField.style.display=weighted?'none':'flex';actualQty.value='';manualActual.value='';scaleState.text 先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.object==='原料'?raw:supply);\n      const x=list.find(x=>x.batch===row.batch&&x.warehouse===task.warehouse&&x.location.includes(row.location));\n      if(!x)throw Error('原库存记录已变化，请重新盘点');x.qty=String(quantity);write(key,list);\n    } else if (quantity !== 1) throw Error('容器身份差异需先核实具体容器，不支持直接修改件数');\n  }\n  window.WarehouseState = {read,write,escape,now,types,receipts,raw,supply,containers:containerList,history:containerHistory,deletionReason,flow,productStocks,locations,frozen,moveProduct,stocks,adjust};\n})();\n\n\u003c/script>\u003cscript>const records=[{no:'RM-OUT-20261030-001',material:'白桦树汁原料',batch:'SAP-20261030',qty:'120 kg',receiver:'生产订单 PO20261030',location:'白桦树汁仓库 / 冷藏库 A',time:'2026-10-30 10:15'}];function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}function render(){rows.innerHTML=records.filter(x=>(!qNo.value||x.no.includes(qNo.value))&&(!qReceiver.value||x.receiver.includes(qReceiver.value))&&(!qMaterial.value||x.material.includes(qMaterial.value))).map(x=>'\u003ctr>\u003ctd>'+x.no+'\u003c/td>\u003ctd>'+x.material+'\u003c/td>\u003ctd>'+x.batch+'\u003c/td>\u003ctd>'+x.qty+'\u003c/td>\u003ctd>'+x.receiver+'\u003c/td>\u003ctd>'+x.location+'\u003c/td>\u003ctd>'+x.time+'\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"toastMsg(\\'已打开出库详情\\')\">详情\u003c/button>\u003c/td>\u003c/tr>').join('')}readBoxRfid.onclick=()=>{boxRfid.value='RFID-BOX-'+Date.now().toString().slice(-6);toastMsg('已读取周转箱 RFID')};addBtn.onclick=()=>{qty.value='';receiver.value='';purpose.value='';boxRfid.value='';orderMap.value='';modal.classList.add('show')};saveBtn.onclick=()=>{const freezePath='';if(WarehouseState.read('warehouse-stocktakes',[]).some(t=>['盘点中','待确认'].includes(t.state)&&(t.object==='全部'||t.object==='原料')&&(!freezePath||freezePath==='暂不上架'||freezePath.includes(t.warehouse))))return toastMsg('相关库存范围正在盘点，暂停出入库');var parts=batch.options[batch.selectedIndex].textContent.split(' / ');if(!qty.value||!receiver.value.trim()||!boxRfid.value.trim()||!orderMap.value){toastMsg('请填写数量、领用业务、周转箱 RFID 和订单映射');return}if(Number(qty.value)>Number(batch.value)){toastMsg('出库数量超过可用库存');return}records.unshift({no:'RM-OUT-'+Date.now().toString().slice(-10),material:parts[0],batch:parts[1],qty:qty.value+' kg',receiver:receiver.value.trim(),boxRfid:boxRfid.value.trim(),orderMap:orderMap.value,location:'白桦 ht:0}\n.category-settings input{width:170px;height:32px;padding:0 8px;border:1px solid #cfd8d0;border-radius:3px}\n.category-settings .hint{margin-bottom:12px}\n.link:disabled{color:#a6ada7;cursor:not-allowed}\n\n\u003c/style>\u003cstyle>.modal.wide{width:900px}.recommend-box{grid-column:1/-1;border:1px solid #dfe6e0;background:#f8faf8;padding:10px}.recommend-box strong{color:#2f6130}\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"app\">\u003cheader class=\"topbar\">\u003cdiv class=\"brand\">八斗芯链数智农业产品平台\u003c/div>\u003cdiv class=\"top-actions\">\u003cspan>admin\u003c/span>\u003cspan>门户\u003c/span>\u003c/div>\u003c/header>\u003cdiv class=\"body\">\u003caside class=\"side\" id=\"warehouseNav\">\u003c/aside>\u003cmain class=\"content\">\u003cdiv class=\"crumb\">智能仓储 / 原料管理 / 原料退料\u003c/div>\u003cdiv class=\"head\">\u003cdiv>\u003ch1>原料退料\u003c/h1>\u003cp>关联原出库单，优先推荐原出库位置并重新入库\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" id=\"addBtn\">+ 新增退料\u003c/button>\u003c/div>\u003csection class=\"panel\">\u003cdiv class=\"query\">\u003cdiv class=\"form-item\">\u003clabel>退料单号\u003c/label>\u003cinput id=\"qNo\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>原出库单\u003c/label>\u003cinput id=\"qOutbound\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>原料\u003c/label>\u003cinput id=\"qMaterial\">\u003c/div>\u003cdiv class=\"query-actions\">\u003cbutton class=\"btn primary\" id=\"searchBtn\">查询\u003c/button>\u003cbutton class=\"btn\" id=\"resetBtn\">重置\u003c/button>\u003c/div>\u003c/div>\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>退料单号\u003c/th>\u003cth>原出库单\u003c/th>\u003cth>原料批次\u003c/th>\u003cth>退回数量\u003c/th>\u003cth>退料原因\u003c/th>\u003cth>退回位置\u003c/th>\u003cth>操作时间\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/section>\u003c/main>\u003c/div>\u003c/div>\u003cdiv class=\"modal-mask\" id=\"modal\">\u003cdiv class=\"modal wide\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\">新增原料退料\u003c/span>\u003cbutton class=\"close\" data-close>×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 原出库单\u003c/label>\u003cselect id=\"outbound\">\u003coption>RM-OUT-20261030-001 / 白桦树汁原料 / SAP-20261030\u003c/option>\u003coption>RM-OUT-20261028-002 / PET 瓶 / PET-20261028\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>包装/整件数量\u003c/label>\u003cinput id=\"packCount\" type=\"number\" min=\"0\" step=\"1\" placeholder=\"件/包/袋\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>单件重量（自动带出）\u003c/label>\u003cinput id=\"pieceWeight\" type=\"number\" step=\"0.001\" value=\"1\" readonly>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>包装皮重\u003c/label>\u003cinput id=\"tareWeight\" type=\"number\" step=\"0.001\" value=\"0.2\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>电子秤毛重\u003c/label>\u003cdiv style=\"display:flex;gap:8px\">\u003cinput id=\"grossWeight\" type=\"number\" step=\"0.001\">\u003cbutton class=\"btn\" type=\"button\" id=\"readScaleBtn\">读取电子秤\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 净重/退回数量\u003c/label>\u003cinput id=\"qty\" type=\"number\" min=\"0.1\" step=\"0.1\" readonly>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 退料原因\u003c/label>\u003cinput id=\"reason\" placeholder=\"剩余未用、质量异常等\">\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>推荐存放位置\u003c/label>\u003cdiv class=\"recommend-box\">\u003cstrong id=\"recommendText\">原出库位置：白桦树汁仓库 / 冷藏库 A / A-01-01\u003c/strong>\u003cbutton class=\"btn small\" type=\"button\" id=\"useRecommendBtn\">采用推荐位置\u003c/button>\u003cspan> 若原位置容量不足，将推荐其他可用节点\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>\u003cb style=\"color:#c00000\">*\u003c/b> 最终退回位置\u003c/label>\u003cselect id=\"location\">\u003coption>暂不上架\u003c/option>\u003coption>白桦树汁仓库 / 冷藏库 A / A-01-01\u003c/option>\u003coption>生物制造仓库 / 原料库 / R-01-02\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>质量状态\u003c/label>\u003cselect id=\"quality\">\u003coption>可用\u003c/option>\u003coption>待检\u003c/option>\u003coption>隔离\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item full\">\u003clabel>退料备注（非必填）\u003c/label>\u003cinput id=\"note\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" data-close>取消\u003c/button>\u003cbutton class=\"btn primary\" id=\"saveBtn\">确认退料\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\nwindow.__warehouseRouteUrl = parent.__warehouseCurrentUrl;\ndocument.addEventListener('click', function (event) {\n  const link = event.target.closest('[data-internal-route]');\n  if (link) { event.preventDefault(); parent.showWarehouseRoute(link.dataset.internalRoute); }\n});\n(function () {\n  const host = document.getElementById('warehouseNav'); if (!host) return;\n  const menu = [[\"标签管理\",[[\"标签档案\",\"label-management.html\"],[\"标签查询\",\"label-query.html\"]]],[\"仓库管理\",[[\"仓库档案\",\"warehouse-config.html\"],[\"库存查询\",\"inventory-ledger.html?view=warehouse\"],[\"库存盘点\",\"stocktake-management.html\"],[\"预警记录\",\"warehouse-warning.html\"]]],[\"容器管理\",[[\"容器档案\",\"container-management.html\"],[\"容器出入库\",\"warehouse-operation.html?object=container\"],[\"容器台账\",\"container-ledger.html\"]]],[\"农资管理\",[[\"农资档案\",\"agricultural-supply-management.html\"],[\"农资入库\",\"agricultural-supply-inbound.html\"],[\"农资出库\",\"agricultural-supply-outbound.html\"],[\"库存台账\",\"inventory-ledger.html?object=supply\"]]],[\"原料管理\",[[\"原料档案\",\"raw-material-management.html\"],[\"原料采购\",\"raw-material-purchase.html\"],[\"原料入库\",\"raw-material-inbound.html\"],[\"原料出库\",\"raw-material-outbound.html\"],[\"原料退料\",\"raw-material-return.html\"],[\"库存台账\",\"inventory-ledger.html?object=raw\"]]],[\"产品管理\",[[\"产品档案\",\"product-management.html\"],[\"产品入库\",\"product-operation.html?view=inbound\"],[\"产品出库\",\"product-operation.html?view=outbound\"],[\"库存台账\",\"inventory-ledger.html?object=product\"]]],[\"报表与统计分析\",[[\"库存报表\",\"warehouse-report.html?view=inventory\"],[\"出入库操作流水\",\"warehouse-report.html?view=operation-flow\"],[\"差异报表\",\"warehouse-report.html?view=difference\"],[\"发货报表\",\"warehouse-report.html?view=shipping\"]]]];\n  const current = new URL(window.__warehouseRouteUrl);\n  const matches = route => { const target = new URL(route, window.__warehouseRouteUrl); return target.pathname === current.pathname && ['object','view'].every(k => target.searchParams.get(k) === current.searchParams.get(k)); };\n  let closed = []; try { closed = JSON.parse(sessionStorage.getItem('warehouse-closed-menus') || '[]'); } catch (_) {}\n  host.innerHTML = '\u003cdiv class=\"side-group\">\u003cdiv class=\"side-title\">智能仓储\u003c/div>' + menu.map(([title, children], index) => { const active = children.some(([,route]) => matches(route)); return '\u003cdiv class=\"side-section ' + (!closed.includes(title) || active ? 'expanded' : '') + '\">\u003cbutton class=\"nav section-title ' + (active ? 'active' : '') + '\" data-group=\"' + index + '\">' + title + '\u003c/button>\u003cdiv class=\"side-children\">' + children.map(([label,route]) => '\u003cbutton class=\"nav ' + (matches(route) ? 'active' : '') + '\" data-route=\"' + route + '\">' + label + '\u003c/button>').join('') + '\u003c/div>\u003c/div>'; }).join('') + '\u003c/div>';\n  host.querySelectorAll('[data-route]').forEach(button => button.onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\u003cscript>\n(function () {\n  'use strict';\n  const read = (key, fallback) => { try { return JSON.parse(sessionStorage.getItem(key)) ?? structuredClone(fallback); } catch (_) { return structuredClone(fallback); } };\n  const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(value));\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const now = () => new Date().toLocaleString('sv-SE');\n  const types = [{name:'白桦树汁周转桶',level:'可选母子二层',use:'重复利用',enabled:true},{name:'香沙芋采收袋',level:'单层',use:'一次性',enabled:true},{name:'生物制造周转箱',level:'母子二层',use:'重复利用',enabled:true}];\n  const containers = [\n    {no:'CT-GROUP-001',type:types[0].name,parent:'',tag:'-',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-001',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-001',location:'领用现场',order:'RW20261029001',status:'出库-使用中',used:true},\n    {no:'CT-002',type:types[0].name,parent:'CT-GROUP-001',tag:'RFID-CT-002',location:'白桦树汁仓库',order:'-',status:'在库',used:false},\n    {no:'CT-003',type:types[0].name,parent:'',tag:'RFID-CT-003',location:'白桦树汁仓库',order:'-',status:'在库',used:true},\n    {no:'CT-004',type:types[0].name,parent:'',tag:'-',location:'运输现场',order:'TS20261029002',status:'待归还',used:true},\n    {no:'BAG-001',type:types[1].name,parent:'',tag:'QR-BAG-001',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-002',type:types[1].name,parent:'',tag:'-',location:'香沙芋仓库',order:'-',status:'在库',used:false},\n    {no:'BAG-003',type:types[1].name,parent:'',tag:'-',location:'采收现场',order:'RW20261028003',status:'待归还',used:true},\n    {no:'BOX-001',type:types[2].name,parent:'',tag:'RFID-BOX-001',location:'维护区',order:'-',status:'维护中',used:true},\n    {no:'BOX-002',type:types[2].name,parent:'',tag:'RFID-BOX-002',location:'生产现场',order:'PO20261028001',status:'出库-使用中',used:true},\n    {no:'BOX-003',type:types[2].name,parent:'',tag:'-',location:'生物制造仓库',order:'-',status:'在库',used:false}\n  ].map((x,i) => ({id:'container-'+i,warehouse:x.location.endsWith('仓库')?x.location:x.no.startsWith('BOX')?'生物制造仓库':'白桦树汁仓库',spec:'',...x}));\n  const receipts = [\n    {no:'PR-IN-20261030-001',product:'白桦树汁成品',batch:'PR-BS-20261030',qty:'500 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-01',order:'PO-20261030-005',time:'2026-10-30 10:30',expiry:'2027-04-30'},\n    {no:'PR-IN-20261031-002',product:'白桦树汁成品',batch:'PR-BS-20261031',qty:'300 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-02',order:'-',time:'2026-10-31 10:30',expiry:'2027-03-31'},\n    {no:'PR-IN-20261031-003',product:'生物制造企业成品',batch:'PR-BIO-20261031',qty:'200 瓶',warehouse:'生物制造仓库',location:'成品库 / M-01',order:'-',time:'2026-10-31 11:30',expiry:'2027-05-31'}\n  ];\n  const raw = [{name:'白桦树汁原料',type:'原料',batch:'SAP-20261030',qty:'1066',unit:'kg',tag:'CT-001 / RFID-CT-001',time:'2026-10-30 09:20',warehouse:'白桦树汁仓库',location:'白桦树汁仓库 / 冷藏库 A / A-01 / A-01-01',state:'在库'}];\n  const supply = [{name:'生产用种',type:'农资',batch:'SD-20261030',qty:'1200',unit:'kg',time:'2026-10-30 08:00',warehouse:'香沙芋仓库',location:'香沙芋仓库 / 常温库 B / B-01-01',state:'在库'}];\n  function containerList() { return read('warehouse-containers', containers); }\n  function containerHistory() {\n    return read('warehouse-container-history', [\n      {no:'CO20261029001',containers:['CT-001','CT-003'],action:'新增出库',from:'白桦树汁仓库',to:'采收现场',order:'RW20261029001',time:'2026-10-29 09:20',user:'admin',note:'领用周转桶'},\n      {no:'CI20261030001',containers:['CT-003'],action:'核销入库',from:'采收现场',to:'白桦树汁仓库',order:'RW20261029001',time:'2026-10-30 18:20',user:'李四',note:'已归还'},\n      {no:'CO20261029002',containers:['CT-004','BAG-003','BOX-002'],action:'新增出库',from:'仓库',to:'业务现场',order:'TS20261029002',time:'2026-10-29 10:00',user:'admin',note:'业务领用'}\n    ]);\n  }\n  function deletionReason(x, list = containerList()) {\n    if (x.deleted) return '容器已删除';\n    if (frozen(x.warehouse,'容器',x.location)) return '容器所在范围正在盘点';\n    if (x.status !== '在库') return '仅在库容器可删除';\n    if (x.used || containerHistory().some(h => h.containers.includes(x.no) && !['首次入库','期初入库'].includes(h.action))) return '容器已有使用或流转记录';\n    if (list.some(c => !c.deleted && c.parent === x.no)) return '请先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.obj \"warehouse-report.html?view=shipping\"]]]];\n  const current = new URL(window.__warehouseRouteUrl);\n  const matches = route => { const target = new URL(route, window.__warehouseRouteUrl); return target.pathname === current.pathname && ['object','view'].every(k => target.searchParams.get(k) === current.searchParams.get(k)); };\n  let closed = []; try { closed = JSON.parse(sessionStorage.getItem('warehouse-closed-menus') || '[]'); } catch (_) {}\n  host.innerHTML = '\u003cdiv class=\"side-group\">\u003cdiv class=\"side-title\">智能仓储\u003c/div>' + menu.map(([title, children], index) => { const active = children.some(([,route]) => matches(route)); return '\u003cdiv class=\"side-section ' + (!closed.includes(title) || active ? 'expanded' : '') + '\">\u003cbutton class=\"nav section-title ' + (active ? 'active' : '') + '\" data-group=\"' + index + '\">' + title + '\u003c/button>\u003cdiv class=\"side-children\">' + children.map(([label,route]) => '\u003cbutton class=\"nav ' + (matches(route) ? 'active' : '') + '\" data-route=\"' + route + '\">' + label + '\u003c/button>').join('') + '\u003c/div>\u003c/div>'; }).join('') + '\u003c/div>';\n  host.querySelectorAll('[data-route]').forEach(button => button.onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\u003cscript>\n(function () {\n  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  window.WarehouseCategorySettings = function (options) {\n    const categories = options.presets.map(name => ({name, builtin:true, enabled:true}));\n    const modal = document.getElementById(options.modal);\n    const rows = modal.querySelector('tbody');\n    let editIndex = -1;\n    let draft = '';\n    const notify = options.notify;\n    function changed() { options.onChange(categories); }\n    function render() {\n      rows.innerHTML = categories.map((x, i) => '\u003ctr>\u003ctd>' + (editIndex === i ? '\u003cinput aria-label=\"分类名称\" value=\"' + escape(draft) + '\">' : escape(x.name)) + '\u003c/td>\u003ctd>' + (x.builtin ? '系统预置' : '项目自定义') + '\u003c/td>\u003ctd>\u003cspan class=\"tag ' + (x.enabled ? 'green' : 'gray') + '\">' + (x.enabled ? '启用' : '停用') + '\u003c/span>\u003c/td>\u003ctd>' + (editIndex === i ? '\u003cbutton class=\"link\" data-save=\"' + i + '\">保存\u003c/button>\u003cbutton class=\"link\" data-cancel>取消\u003c/button>' : '\u003cbutton class=\"link\" data-toggle=\"' + i + '\">' + (x.enabled ? '停用' : '启用') + '\u003c/button>' + (x.builtin ? '' : '\u003cbutton class=\"link\" data-edit=\"' + i + '\">编辑\u003c/button>\u003cbutton class=\"link\" data-delete=\"' + i + '\">删除\u003c/button>')) + '\u003c/td>\u003c/tr>').join('');\n      if (editIndex === categories.length) rows.insertAdjacentHTML('beforeend', '\u003ctr>\u003ctd>\u003cinput aria-label=\"分类名称\" placeholder=\"请输入分类名称\">\u003c/td>\u003ctd>项目自定义\u003c/td>\u003ctd>启用\u003c/td>\u003ctd>\u003cbutton class=\"link\" data-save=\"' + editIndex + '\">保存\u003c/button>\u003cbutton class=\"link\" data-cancel>取消\u003c/button>\u003c/td>\u003c/tr>');\n    }\n    rows.onclick = event => {\n      const button = event.target.closest('button');\n      if (!button) return;\n      if (button.hasAttribute('data-cancel')) { editIndex = -1; render(); return; }\n      if (button.hasAttribute('data-save')) {\n        const index = Number(button.dataset.save);\n        const name = rows.querySelector('input').value.trim();\n        if (!name) return notify('请输入分类名称');\n        if (categories.some((x,i) => i !== index && x.name === name)) return notify('分类名称不能重复');\n        if (index === categories.length) categories.push({name,builtin:false,enabled:true});\n        else { const old = categories[index].name; categories[index].name = name; options.onRename(old,name); }\n        editIndex = -1; render(); changed(); notify('分类已保存'); return;\n      }\n      if (editIndex !== -1) return notify('请先保存或取消当前编辑行');\n      if (button.hasAttribute('data-edit')) { editIndex=Number(button.dataset.edit); draft=categories[editIndex].name; render(); return; }\n      if (button.hasAttribute('data-toggle')) { const x=categories[Number(button.dataset.toggle)]; x.enabled=!x.enabled; render(); changed(); return; }\n      if (button.hasAttribute('data-delete')) {\n        const index=Number(button.dataset.delete), item=categories[index];\n        if (options.isUsed(item.name)) return notify('该分类已被档案引用，只能停用');\n        if (!confirm('确认删除分类“'+item.name+'”？')) return;\n        categories.splice(index,1); render(); changed();\n      }\n    };\n    modal.querySelector('[data-add-category]').onclick = () => {\n      if (editIndex !== -1) return notify('请先保存或取消当前编辑行');\n      editIndex=categories.length; draft=''; render(); rows.querySelector('input').focus();\n    };\n    modal.querySelectorAll('[data-close]').forEach(button => button.onclick = () => { editIndex=-1; modal.classList.remove('show'); });\n    this.open = () => { editIndex=-1; render(); modal.classList.add('show'); };\n    this.categories = categories;\n  };\n  window.warehouseEscape = escape;\n})();\n\n\u003c/script>\u003cscript>const products=[{code:'PR-BS-001',name:'白桦树汁成品',category:'成品',spec:'300ml',unit:'瓶',validity:'12个月',bom:'未配置',status:'启用'},{code:'PR-BS-002',name:'白桦树汁浓缩液',category:'半成品',spec:'20L',unit:'桶',validity:'6个月',bom:'已配置',status:'启用'},{code:'PR-MED-001',name:'生物制造企业成品',category:'成品',spec:'25kg',unit:'袋',validity:'12个月',bom:'已配置',status:'启用'}];let category='',editing=null;function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}function renderCategories(items){let active=items.filter(x=>x.enabled).map(x=>x.name);categoryButtons.innerHTML='\u003cbutton class=\"'+(category?'':'active')+'\" data-category=\"\">全部\u003c/button>'+active.map(x=>'\u003cbutton class=\"'+(category===x?'active':'')+'\" data-category=\"'+x+'\">'+x+'\u003c/button>').join('');productCategory.innerHTML=active.map(x=>'\u003coption>'+x+'\u003c/option>').join('');categoryButtons.querySelectorAll('button').forEach(b=>b.onclick=()=>{categoryButtons.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.category;render()})}function render(){productRows.innerHTML=products.filter(x=>(!category||x.category===category)&&(!qKeyword.value.trim()||x.name.includes(qKeyword.value.trim())||x.code.includes(qKeyword.value.trim()))&&(!qBom.value||x.bom===qBom.value)&&(!qStatus.value||x.status===qStatus.value)).map(x=>'\u003ctr>\u003ctd>'+x.code+'\u003c/td>\u003ctd>'+x.name+'\u003c/td>\u003ctd>'+x.category+'\u003c/td>\u003ctd>'+x.spec+'\u003c/td>\u003ctd>'+x.unit+'\u003c/td>\u003ctd>'+x.validity+'\u003c/td>\u003ctd>'+x.bom+'\u003c/td>\u003ctd>\u003cspan class=\"tag '+(x.status==='启用'?'green':'gray')+'\">'+x.status+'\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"link\" data-edit=\"'+x.code+'\">编辑\u003c/button>\u003cbutton class=\"link\" data-toggle=\"'+x.code+'\">'+(x.status==='启用'?'停用':'启用')+'\u003c/button>\u003cbutton class=\"link\" data-detail=\"'+x.code+'\">详情\u003c/button>\u003c/td>\u003c/tr>').join('')||'\u003ctr>\u003ctd colspan=\"9\" style=\"text-align:center\">暂无产品记录\u003c/td>\u003c/tr>';productRows.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=products.find(x=>x.code===b.dataset.edit);modalTitle.textContent='编辑产品';productName.value=editing.name;productCategory.value=editing.category;productSpec.value=editing.spec;productUnit.value=editing.unit;productValidity.value=editing.validity;productBom.value=editing.bom;openModal('productModal')});productRows.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let x=products.find(x=>x.code===b.dataset.toggle);x.status=x.status==='启用'?'停用':'启用';render()});productRows.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>toastMsg('已打开产品档案详情'))}categoryConfigBtn.onclick=()=>categorySettings.open();addBtn.onclick=()=>{editing=null;modalTitle.textContent='新增产品';productName.value='';productCategory.value=category||'成品';productSpec.value='';productUnit.value='';productValidity.value='';productBom.value='未配置';openModal('productModal')};saveBtn.onclick=()=>{if(!productName.value.trim()||!productSpec.value.trim()||!productUnit.value.trim())return toastMsg('请填写必填项');let item={name:productName.value.trim(),category:productCategory.value,spec:productSpec.value.trim(),unit:productUnit.value.trim(),validity:productValidity.value.trim()||'-',bom:productBom.value,status:'启用'};if(editing)Object.assign(editing,item);else products.unshift(Object.assign({code:'PR-NEW-'+String(products.length+1).padStart(3,'0')},item));closeModal('productModal');render();toastMsg('产品档案已保存')};searchBtn.onclick=render;resetBtn.onclick=()=>{qKeyword.value='';qBom.value='';qExpiry.value='';qStatus.value='';category='';renderCategories(categorySettings.categories);render()};const categorySettings=new WarehouseCategorySettings({modal:'categoryModal',presets:['成品','半成品','包装产品'],notify:toastMsg,isUsed:name=>products.some(x=>x.category===name),onRename:(a,b)=>products.forEach(x=>{if(x.category===a)x.category=b}),onChange:items=>{renderCategories(items);render()}});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));renderCategories(categorySettings.categories);render();\u003c/script>\u003c/body>\u003c/html>\n","product-operation.html":"\u003c!doc turn '容器已删除';\n    if (frozen(x.warehouse,'容器',x.location)) return '容器所在范围正在盘点';\n    if (x.status !== '在库') return '仅在库容器可删除';\n    if (x.used || containerHistory().some(h => h.containers.includes(x.no) && !['首次入库','期初入库'].includes(h.action))) return '容器已有使用或流转记录';\n    if (list.some(c => !c.deleted && c.parent === x.no)) return '请先处理下级容器';\n    return '';\n  }\n  function flow(type, no, item, warehouse, result) {\n    const rows = read('warehouse-operation-flows', []);\n    rows.unshift([now(),type,no,item,warehouse,'admin',result]); write('warehouse-operation-flows', rows);\n  }\n  function productStocks() {\n    const balances = read('product-stock-balances', {}), positions = read('product-stock-locations', {});\n    return read('product-inbound-records', receipts).concat(read('product-stock-splits', [])).map(x => ({...x,...positions[x.no],qty:Number(balances[x.no] ?? parseFloat(x.qty)),unit:'瓶',state:x.state||'在库'}));\n  }\n  const locations = {'白桦树汁仓库':['成品区 / P-01','成品区 / P-02','冷藏库 A / A-01 / A-01-01','冷藏库 A / A-01 / A-01-02'],'香沙芋仓库':['常温库 B / B-01-01','常温库 B / B-01-02'],'生物制造仓库':['成品库 / M-01','原料库 / R-01 / R-01-02']};\n  function frozen(warehouse, object, location) {\n    return read('warehouse-stocktakes', []).find(t => ['盘点中','待确认'].includes(t.state) && t.warehouse === warehouse && (t.object === '全部' || t.object === object) && (!t.location || !location || location.includes(t.location)));\n  }\n  function moveProduct(id, amount, warehouse, location, reason) {\n    const x = productStocks().find(s => s.no === id);\n    if (!x || !Number.isFinite(amount) || amount \u003c= 0 || amount > x.qty) throw Error('移库数量必须大于0且不超过可用库存');\n    if (x.state !== '在库') throw Error('仅在库库存允许移库');\n    if (!locations[warehouse]?.includes(location)) throw Error('请选择有效目标库位');\n    if (frozen(x.warehouse,'产品',x.location) || frozen(warehouse,'产品',location)) throw Error('来源或目标位置正在盘点，暂停移库');\n    if (warehouse === x.warehouse && location === x.location) throw Error('目标位置与当前位置相同');\n    if (!reason.trim()) throw Error('请填写移库原因');\n    const positions = read('product-stock-locations', {}), balances = read('product-stock-balances', {}), no = 'PR-MV-'+Date.now();\n    if (amount === x.qty) positions[id] = {warehouse,location};\n    else {\n      balances[id] = x.qty-amount;\n      const splits = read('product-stock-splits', []), targetId = no+'-'+Math.random().toString(36).slice(2,6);\n      splits.push({...x,no:targetId,sourceReceipt:x.sourceReceipt||id,warehouse,location,qty:amount});\n      write('product-stock-splits',splits);\n    }\n    write('product-stock-locations',positions);write('product-stock-balances',balances);\n    flow('产品移库',no,x.product+' / '+x.batch,warehouse,x.warehouse+' / '+x.location+' → '+warehouse+' / '+location+'；'+amount+' 瓶；'+reason.trim());\n  }\n  function stocks(object) {\n    if (object === '产品') return productStocks().filter(x=>x.qty>0).map(x=>({id:x.no,object,name:x.product,batch:x.batch,qty:x.qty,unit:'瓶',warehouse:x.warehouse,location:x.location,tag:x.rfid||'',source:x}));\n    if (object === '容器') return containerList().filter(x=>!x.deleted&&x.status==='在库').map(x=>({id:x.id,object,name:x.type,batch:x.no,qty:1,unit:'个',warehouse:x.warehouse,location:x.location,tag:x.tag,source:x}));\n    const list = object === '原料' ? read('raw-ledger-items',raw) : read('supply-ledger-items',supply);\n    return list.map((x,i)=>({id:object+'-'+i,object,name:x.name,batch:x.batch,qty:Number(String(x.qty).replace(/,/g,'')),unit:x.unit,warehouse:x.warehouse,location:x.window.__warehouseLocation.replace(x.warehouse+' / ',''),tag:x.tag||'',source:x}));\n  }\n  function adjust(row, quantity, task) {\n    if (row.object === '产品') { const b=read('product-stock-balances',{}); b[row.id]=quantity;write('product-stock-balances',b); }\n    else if (row.object === '原料' || row.object === '农资') {\n      const key=row.object==='原料'?'raw-ledger-items':'supply-ledger-items', list=read(key,row.object==='原料'?raw:supply);\n      const x=list.find(x=>x.batch===row.batch&&x.warehouse===task.warehouse&&x.location.includes(row.location));\n      if(!x)throw Error('原库存记录已变化，请重新盘点');x.qty=String(quantity);write(key,list);\n    } else if (quantity !== 1) throw Error('容器身份差异需先核实具体容器，不支持直接修改件数');\n  }\n  window.WarehouseState = {read,write,escape,now,types,receipts,raw,supply,containers:containerList,history:containerHistory,deletionReason,flow,productStocks,locations,frozen,moveProduct,stocks,adjust};\n})();\n\n\u003c/script>\u003cscript>\nconst params=new URL(window.__warehouseLocation.href).searchParams;let mode=params.get('view')||'inbound';if(mode==='move')window.__warehouseLocation.replace('inventory-ledger.html?object=product');\nconst labels={inbound:'产品入库',move:'产品移库',outbound:'产品出库'};\nconst descriptions={inbound:'维护产品批次、入库时间、数量、有效期和存放位置，支持 RFID 与称重设备接入',move:'选择产品库存并变更库位，重新读取目标库位标签后更新库存位置记录',outbound:'按产品、批次及有效期查找库存，确认拣货位置后出库'};\nconst stockLocation=document.getElementById('location');\nconst defaultReceipts=[\n {no:'PR-IN-20261030-001',product:'白桦树汁成品',batch:'PR-BS-20261030',qty:'500 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-01',order:'PO-20261030-005',time:'2026-10-30 10:30',expiry:'2027-04-30'},\n {no:'PR-IN-20261031-002',product:'白桦树汁成品',batch:'PR-BS-20261031',qty:'300 瓶',warehouse:'白桦树汁仓库',location:'成品区 / P-02',order:'-',time:'2026-10-31 10:30',expiry:'2027-03-31'},\n {no:'PR-IN-20261031-003',product:'生物制造企业成品',batch:'PR-BIO-20261031',qty:'200 瓶',warehouse:'生物制造仓库',location:'成品库 / M-01',order:'-',time:'2026-10-31 11:30',expiry:'2027-05-31'}\n];\nlet receipts=JSON.parse(sessionStorage.getItem('product-inbound-records')||'null')||defaultReceipts;\nlet records=mode==='outbound'?JSON.parse(sessionStorage.getItem('product-outbound-records')||'[]'):receipts;\nlet balances=JSON.parse(sessionStorage.getItem('product-stock-balances')||'{}'),pickedStock=null;\nfunction escapeCell(value){return String(value??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\n ue.trim(),qty:amount+' 瓶',warehouse:stockLocation.value.split(' / ')[0],location:stockLocation.value.split(' / ').slice(1).join(' / '),order:order.value||'-',time:new Date().toLocaleString('sv-SE'),expiry:expiry.value,rfid:rfid.value};\n records.unshift(entry);\n if(mode==='inbound'){sessionStorage.setItem('product-inbound-records',JSON.stringify(records));WarehouseState.flow('产品入库',entry.no,entry.product+' / '+entry.batch,entry.warehouse,'已入库 '+entry.qty+'；'+entry.location)}\n if(mode==='outbound'){\n sessionStorage.setItem('product-outbound-records',JSON.stringify(records));const flows=JSON.parse(sessionStorage.getItem('warehouse-operation-flows')||'[]');flows.unshift([entry.time,'产品出库',entry.no,entry.product+' / '+entry.batch,entry.warehouse,'admin','已出库 '+entry.qty+'；拣货位置：'+entry.location]);sessionStorage.setItem('warehouse-operation-flows',JSON.stringify(flows))\n }\n modal.classList.remove('show');render();toastMsg(labels[mode]+'已保存')\n};\nsearchBtn.onclick=render;resetBtn.onclick=()=>{qNo.value='';qProduct.value='';qBatch.value='';qWarehouse.value='';render()};\ndocument.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.classList.remove('show'));render();\n\u003c/script>\u003c/body>\u003c/html>\n","warehouse-report.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cscript>window.__warehouseRouteUrl=parent.__warehouseCurrentUrl;window.__warehouseLocation={replace:value=>parent.showWarehouseRoute(value)};Object.defineProperty(window.__warehouseLocation,'href',{get:()=>window.__warehouseRouteUrl,set:value=>parent.showWarehouseRoute(value)});\u003c/script>\u003cmeta charset=\"utf-8\">\u003ctitle>报表与统计分析 - 智能仓储\u003c/title>\u003cstyle>\n:root{--green:#387739;--green2:#eef6ee;--bg:#f5f5f5;--line:#dfe5de;--text:#26332a;--muted:#77837a;--blue:#3478b8;--orange:#b77a28;--red:#bd5149}*{box-sizing:border-box}html,body{margin:0;min-width:1600px;background:var(--bg);color:var(--text);font:14px \"Microsoft YaHei\",\"PingFang SC\",Arial,sans- .onclick = () => parent.showWarehouseRoute(button.dataset.route));\n  host.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { const section = button.parentElement; section.classList.toggle('expanded'); const name = menu[Number(button.dataset.group)][0]; closed = closed.filter(x => x !== name); if (!section.classList.contains('expanded')) closed.push(name); try { sessionStorage.setItem('warehouse-closed-menus', JSON.stringify(closed)); } catch (_) {} });\n})();\n\u003c/script>\u003cmain class=\"content\">\u003cdiv class=\"crumb\">智能仓储 / 仓储物管理\u003c/div>\u003cdiv class=\"head\">\u003cdiv>\u003ch1>仓储物管理\u003c/h1>\u003cp>按仓储物类型分模块管理，模块内通过分类树细分具体物料\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" onclick=\"openModal()\">+ 新增仓储物\u003c/button>\u003c/div>\u003cdiv class=\"split\">\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003cspan class=\"panel-title\">仓储物模块\u003c/span>\u003cbutton class=\"btn small\" onclick=\"showToast('分类配置已打开')\">分类配置\u003c/button>\u003c/div>\u003cdiv class=\"category-tree\">\u003cbutton class=\"active\" onclick=\"selectKind(this,'全部原料')\">原料档案\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'农产品原料')\">农产品原料\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'包装材料')\">包装材料\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'辅料')\">辅料\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'项目自定义分类')\">项目自定义分类\u003c/button>\u003cbutton onclick=\"selectKind(this,'产品档案')\">产品档案\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'成品')\">成品\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'半成品')\">半成品\u003c/button>\u003cbutton onclick=\"selectKind(this,'农资档案')\">农资档案\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'肥料')\">肥料\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'农药')\">农药\u003c/button>\u003cbutton onclick=\"selectKind(this,'容器档案')\">容器档案\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'周转桶')\">周转桶\u003c/button>\u003cbutton class=\"sub-category\" onclick=\"selectKind(this,'采收袋')\">采收袋\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003cspan class=\"panel-title\" id=\"listTitle\">原料档案\u003c/span>\u003cspan class=\"muted\">3 条\u003c/span>\u003c/div>\u003cdiv class=\"object-note\">菜单和权限按“原料、产品、农资、容器”区分；同一模块内再通过分类树细分，不为每一种原料单独创建菜单。入库、出库、库存台账复用同一套仓储能力。\u003c/div>\u003cdiv class=\"query\">\u003cdiv class=\"form-item\">\u003clabel>原料分类\u003c/label>\u003cselect>\u003coption>全部\u003c/option>\u003coption>农产品原料\u003c/option>\u003coption>包装材料\u003c/option>\u003coption>辅料\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>名称/编码\u003c/label>\u003cinput placeholder=\"请输入关键词\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>批次管理\u003c/label>\u003cselect>\u003coption>全部\u003c/option>\u003coption>是\u003c/option>\u003coption>否\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>状态\u003c/label>\u003cselect>\u003coption>全部\u003c/option>\u003coption>启用\u003c/option>\u003coption>停用\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"query-actions\">\u003cbutton class=\"btn primary\" onclick=\"showToast('查询完成')\">查询\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>编码\u003c/th>\u003cth>名称\u003c/th>\u003cth>原料分类\u003c/th>\u003cth>规格\u003c/th>\u003cth>单位\u003c/th>\u003cth>批次/效期\u003c/th>\u003cth>默认位置\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RM-BS-001\u003c/td>\u003ctd>白桦树汁原料\u003c/td>\u003ctd>农产品原料\u003c/td>\u003ctd>鲜汁\u003c/td>\u003ctd>kg\u003c/td>\u003ctd>是\u003c/td>\u003ctd>冷藏库 A\u003c/td>\u003ctd>\u003cspan class=\"tag green\">启用\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"editItem('白桦树汁原料')\">编辑\u003c/button> \u003cbutton class=\"link\" onclick=\"toggleItem(this,'停用')\">停用\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RM-PK-001\u003c/td>\u003ctd>PET 瓶\u003c/td>\u003ctd>包装材料\u003c/td>\u003ctd>300ml\u003c/td>\u003ctd>个\u003c/td>\u003ctd>否\u003c/td>\u003ctd>常温库 B\u003c/td>\u003ctd>\u003cspan class=\"tag green\">启用\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"editItem('PET 瓶')\">编辑\u003c/button> \u003cbutton class=\"link\" onclick=\"toggleItem(this,'停用')\">停用\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RM-AUX-001\u003c/td>\u003ctd>食品级清洁剂\u003c/td>\u003ctd>辅料\u003c/td>\u003ctd>5L\u003c/td>\u003ctd>桶\u003c/td>\u003ctd>是\u003c/td>\u003ctd>辅料库\u003c/td>\u003ctd>\u003cspan class=\"tag gray\">停用\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"editItem('食品级清洁剂')\">编辑\u003c/button> \u003cbutton class=\"link\" onclick=\"toggleItem(this,'启用')\">启用\u003c/button>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003c/div>\u003c/main>\u003c/div>\u003c/div>\u003cdiv class=\"modal-mask\" id=\"modal\">\u003cdiv class=\"modal\">\u003cdiv class=\"modal-head\">\u003cspan class=\"modal-title\" id=\"modalTitle\">新增仓储物档案\u003c/span>\u003cbutton class=\"close\" onclick=\"closeModal()\">×\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"form-item\">\u003clabel>仓储物类型\u003c/label>\u003cselect>\u003coption>原料\u003c/option>\u003coption>产品\u003c/option>\u003coption>农资\u003c/option>\u003coption>容器\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>分类\u003c/label>\u003cselect>\u003coption>农产品原料\u003c/option>\u003coption>包装材料\u003c/option>\u003coption>辅料\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>名称\u003c/label>\u003cinput id=\"itemName\" placeholder=\"请输入名称\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>编码\u003c/label>\u003cinput placeholder=\"可自动生成\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>规格\u003c/label>\u003cinput placeholder=\"规格信息\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>计量单位\u003c/label>\u003cselect>\u003coption>kg\u003c/option>\u003coption>个\u003c/option>\u003coption>箱\u003c/option>\u003coption>桶\u003c/option>\u003coption>袋\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>默认存储位置\u003c/label>\u003cselect>\u003coption>冷藏库 A\u003c/option>\u003coption>常温库 B\u003c/option>\u003coption>农资库\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>是否批次管理\u003c/label>\u003cselect>\u003coption>是\u003c/option>\u003coption>否\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>是否效期管理\u003c/label>\u003cselect>\u003coption>是\u003c/option>\u003coption>否\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>是否需要 RFID\u003c/label>\u003cselect>\u003coption>否\u003c/option>\u003coption>是\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton class=\"btn\" onclick=\"closeModal()\">取消\u003c/button>\u003cbutton class=\"btn primary\" onclick=\"saveItem()\">保存\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\u003cscript>function openModal(){modal.classList.add('show');modalTitle.textContent='新增仓储物档案'}function closeModal(){modal.classList.remove('show')}function selectKind(btn,title){document.querySelectorAll('.category-tree button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');listTitle.textContent=title;showToast('已切换至'+title)}function editItem(name){modal.classList.add('show');modalTitle.textContent='编辑仓储物档案';itemName.value=name}function saveItem(){closeModal();showToast('仓储物档案已保存')}function toggleItem(btn,action){btn.textContent=action;showToast('状态已更新为'+action)}function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}\u003c/script>\u003c/body>\u003c/html>\n\n\n"};

window.showWarehouseRoute = function(route) { const url = new URL(route, new URL("label-management.html", location.href)); const name = url.pathname.split('/').pop(); if (!warehousePages[name]) { alert('该页面未包含在分享文件中：' + name); return; } window.__warehouseCurrentUrl = url.href; const doc = warehousePages[name].replace('</head>', '<script>window.__warehouseRouteUrl=' + JSON.stringify(url.href).replace(/</g,'\\u003c') + '<\/script></head>'); document.getElementById('warehousePage').srcdoc = doc; };
